<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciné Délices — Parallax Hero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --dark: #0a0a0f;
    --film: #1a1a2e;
  }

  html, body { height: 100%; overflow: hidden; background: var(--dark); }

  /* ── SCENE ── */
  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    cursor: none;
  }

  /* ── PARALLAX LAYERS ── */
  .layer {
    position: absolute;
    inset: -8%;
    will-change: transform;
    transition: transform 0.08s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* Layer 0 — gradient de fond */
  .layer-bg {
    background:
      radial-gradient(ellipse 80% 60% at 30% 40%, #1a0a2e 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 70% 60%, #0d1a2e 0%, transparent 60%),
      linear-gradient(160deg, #0a0a0f 0%, #0f0f1e 50%, #0a0f1a 100%);
  }

  /* Layer 1 — grain cinéma */
  .layer-grain::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    opacity: 0.35;
    animation: grain 0.5s steps(1) infinite;
  }

  @keyframes grain {
    0%, 100% { transform: translate(0, 0); }
    10%       { transform: translate(-2%, -3%); }
    20%       { transform: translate(3%, 1%); }
    30%       { transform: translate(-1%, 4%); }
    40%       { transform: translate(4%, -2%); }
    50%       { transform: translate(-3%, 3%); }
    60%       { transform: translate(2%, -4%); }
    70%       { transform: translate(-4%, 1%); }
    80%       { transform: translate(1%, 3%); }
    90%       { transform: translate(3%, -1%); }
  }

  /* Layer 2 — orbes lumineux */
  .layer-orbs {
    background:
      radial-gradient(circle 400px at 25% 35%, rgba(201,168,76,0.12) 0%, transparent 70%),
      radial-gradient(circle 300px at 75% 65%, rgba(100,140,220,0.08) 0%, transparent 70%),
      radial-gradient(circle 250px at 55% 20%, rgba(201,168,76,0.06) 0%, transparent 60%);
  }

  /* Layer 3 — particules */
  .layer-particles { pointer-events: none; }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    animation: float var(--dur) var(--delay) ease-in-out infinite;
  }

  @keyframes float {
    0%   { transform: translateY(110vh) scale(0); opacity: 0; }
    10%  { opacity: var(--op); }
    90%  { opacity: var(--op); }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Layer 4 — bandes pellicule gauche/droite */
  .layer-film::before,
  .layer-film::after {
    content: '';
    position: absolute;
    top: 0;
    width: 28px;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 18px,
      rgba(255,255,255,0.04) 18px,
      rgba(255,255,255,0.04) 24px,
      transparent 24px,
      transparent 36px
    );
  }
  .layer-film::before { left: 8%; border-right: 1px solid rgba(255,255,255,0.05); }
  .layer-film::after  { right: 8%; border-left: 1px solid rgba(255,255,255,0.05); }

  /* Layer 5 — lignes de scan */
  .layer-scan {
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
  }

  /* ── VIGNETTE ── */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 10;
  }

  /* ── CONTENT ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 2rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    padding: 0.4rem 1.2rem;
    border-radius: 100px;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s ease forwards;
  }

  .badge::before {
    content: '';
    width: 5px;
    height: 5px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 700;
    color: #fff;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 0.2em;
    opacity: 0;
    animation: fadeUp 0.9s 0.5s ease forwards;
  }

  .title em {
    font-style: italic;
    color: var(--gold-light);
    display: block;
  }

  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.85rem, 1.5vw, 1.1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
    margin-top: 1.5rem;
    max-width: 420px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 0.9s 0.7s ease forwards;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2rem 0;
    opacity: 0;
    animation: fadeUp 0.9s 0.9s ease forwards;
  }

  .divider-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider-line:last-child {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .divider-icon {
    font-size: 1.2rem;
    filter: sepia(1) saturate(2) hue-rotate(10deg);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    padding: 0.9rem 2.2rem;
    border-radius: 100px;
    text-decoration: none;
    opacity: 0;
    animation: fadeUp 0.9s 1.1s ease forwards;
    box-shadow: 0 0 40px rgba(201,168,76,0.25);
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }

  .cta:hover {
    box-shadow: 0 0 60px rgba(201,168,76,0.45);
    transform: translateY(-2px);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── STATS BAR ── */
  .stats {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 3rem;
    z-index: 20;
    opacity: 0;
    animation: fadeUp 0.9s 1.4s ease forwards;
  }

  .stat { text-align: center; }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-top: 0.3rem;
  }

  .stat-sep {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.1);
  }

  /* ── CUSTOM CURSOR ── */
  .cursor {
    position: fixed;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
    mix-blend-mode: screen;
  }

  .cursor-ring {
    position: fixed;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
  }

  /* ── SCROLL HINT ── */
  .scroll-hint {
    position: absolute;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 20;
    opacity: 0;
    animation: fadeUp 1s 1.6s ease forwards;
  }

  .scroll-hint span {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    writing-mode: vertical-rl;
  }

  .scroll-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollAnim 2s ease infinite;
  }

  @keyframes scrollAnim {
    0%   { transform: scaleY(0); transform-origin: top; }
    50%  { transform: scaleY(1); transform-origin: top; }
    51%  { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="scene" id="scene">

  <!-- Layers parallax -->
  <div class="layer layer-bg"      data-depth="0.1" id="l0"></div>
  <div class="layer layer-orbs"    data-depth="0.25" id="l1"></div>
  <div class="layer layer-film"    data-depth="0.05" id="l2"></div>
  <div class="layer layer-particles" data-depth="0" id="l3"></div>
  <div class="layer layer-grain"   data-depth="0" id="l4"></div>
  <div class="layer layer-scan"    data-depth="0" id="l5"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Content -->
  <div class="content">
    <div class="badge">🎬 Ciné Délices — 2026</div>

    <h1 class="title">
      Cuisine<br>
      <em>&amp; Cinéma</em>
    </h1>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-icon">🍽️</span>
      <div class="divider-line"></div>
    </div>

    <p class="subtitle">Des recettes inspirées de vos films préférés.<br>Une expérience à la croisée de la table et de l'écran.</p>

    <a href="#" class="cta">Découvrir les recettes →</a>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-number" id="countMovies">0</div>
      <div class="stat-label">Films</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-number" id="countRecipes">0</div>
      <div class="stat-label">Recettes</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-number" id="countMembers">0</div>
      <div class="stat-label">Membres</div>
    </div>
  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span>Scroll</span>
  </div>

</div>

<script>
// ── Parallax mouse ──
const layers = [
  { el: document.getElementById('l0'), depth: 0.15 },
  { el: document.getElementById('l1'), depth: 0.3  },
  { el: document.getElementById('l2'), depth: 0.08 },
];

let mx = 0, my = 0, cx = 0, cy = 0;

document.addEventListener('mousemove', e => {
  mx = (e.clientX / window.innerWidth  - 0.5) * 2;
  my = (e.clientY / window.innerHeight - 0.5) * 2;
});

function raf() {
  cx += (mx - cx) * 0.06;
  cy += (my - cy) * 0.06;

  layers.forEach(({ el, depth }) => {
    const x = cx * depth * 40;
    const y = cy * depth * 40;
    el.style.transform = `translate(${x}px, ${y}px)`;
  });

  requestAnimationFrame(raf);
}
raf();

// ── Custom cursor ──
const cursor     = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');
let cursorX = 0, cursorY = 0, ringX = 0, ringY = 0;

document.addEventListener('mousemove', e => {
  cursorX = e.clientX;
  cursorY = e.clientY;
});

(function animCursor() {
  ringX += (cursorX - ringX) * 0.12;
  ringY += (cursorY - ringY) * 0.12;
  cursor.style.left     = cursorX + 'px';
  cursor.style.top      = cursorY + 'px';
  cursorRing.style.left = ringX + 'px';
  cursorRing.style.top  = ringY + 'px';
  requestAnimationFrame(animCursor);
})();

// ── Particules ──
const container = document.getElementById('l3');
for (let i = 0; i < 28; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 2.5 + 0.5;
  p.style.cssText = `
    width: ${size}px;
    height: ${size}px;
    left: ${Math.random() * 100}%;
    --dur: ${Math.random() * 12 + 8}s;
    --delay: -${Math.random() * 20}s;
    --op: ${Math.random() * 0.5 + 0.1};
  `;
  container.appendChild(p);
}

// ── Compteurs animés ──
function animCount(el, target, suffix = '') {
  let current = 0;
  const step = target / 60;
  const timer = setInterval(() => {
    current = Math.min(current + step, target);
    el.textContent = Math.floor(current) + suffix;
    if (current >= target) clearInterval(timer);
  }, 24);
}

setTimeout(() => {
  animCount(document.getElementById('countMovies'),  42);
  animCount(document.getElementById('countRecipes'), 87);
  animCount(document.getElementById('countMembers'), 1200, '+');
}, 1500);
</script>
</body>
</html>
