<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Badges Contributeur — Ciné Délices · Final</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>

/* ══════════════════════════════════════════
   DESIGN TOKENS — Ciné Délices Moodboard v5
══════════════════════════════════════════ */
:root {
  /* Gold */
  --or-titre:           #C4A052;
  --or-100:             #D4A843;
  --or-200:             #B8882A;
  --dore-clair:         #F2C84B;
  --gold-gradient:      linear-gradient(135deg, #B8882A 0%, #D4A843 30%, #F2C84B 55%, #FFE085 80%, #D4A843 100%);

  /* Rouge */
  --rouge-cta:          #C23018;
  --rouge-gradient:     linear-gradient(135deg, #8B1C13 0%, #C23018 55%, #D43A20 100%);

  /* Surfaces */
  --argent:             #e8e8e8;
  --f-display:          'Bebas Neue', cursive;
  --f-title:            'Cinzel', serif;
  --f-body:             'Lato', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: radial-gradient(ellipse at 50% 55%, #0d1d2e 0%, #060c14 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  padding: 3rem 2rem;
  font-family: var(--f-body);
}

.section-title {
  font-family: var(--f-display);
  font-size: 0.75rem;
  letter-spacing: 5px;
  color: rgba(196,160,82,.22);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 0.5rem;
}

.row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3rem;
  flex-wrap: wrap;
}

.divider {
  width: 360px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(196,160,82,.1), transparent);
}

.wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }

.caption {
  font-family: var(--f-display);
  font-size: 0.72rem;
  letter-spacing: 3.5px;
  color: rgba(196,160,82,.28);
  text-transform: uppercase;
}
.dim {
  font-family: var(--f-body);
  font-size: 0.5rem;
  font-weight: 300;
  letter-spacing: 1.6px;
  color: rgba(196,160,82,.18);
  text-transform: uppercase;
  margin-top: -2px;
}
.variant-label {
  font-family: var(--f-display);
  font-size: 0.6rem;
  letter-spacing: 3px;
  color: rgba(196,160,82,.18);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 0.3rem;
  margin-top: 0.5rem;
}

/* ══════════════════════════════════════════
   BADGE 48px — FORMAT PRINCIPAL
══════════════════════════════════════════ */
.badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 48px;
  border-radius: 999px;
  padding: 0 16px 0 6px;
  overflow: hidden;
  cursor: default;
  transition: transform .25s ease, box-shadow .3s ease;
}
.badge:hover { transform: translateY(-2px); }
.badge::before {
  content: '';
  position: absolute;
  top: 0; left: 12%; right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.13), transparent);
  pointer-events: none;
  z-index: 3;
}
.badge .av { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; position: relative; z-index: 2; }
.badge .av img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; }
.badge .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; z-index: 2; }
.badge .pseudo {
  font-family: var(--f-title);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.6px;
  color: var(--argent);
  white-space: nowrap;
  line-height: 1;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--f-title);
  font-size: 0.38rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  line-height: 1.5;
  white-space: nowrap;
}
.pill-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }

/* Pill Admin — doré */
.pill--or {
  background: linear-gradient(135deg, rgba(90,60,10,.85) 0%, rgba(140,100,20,.75) 45%, rgba(180,136,42,.65) 100%);
  border: 1px solid rgba(196,160,82,.55);
  color: rgba(255,235,160,.95);
  box-shadow: 0 0 8px rgba(196,160,82,.3), inset 0 1px 0 rgba(255,255,255,.12);
}
.pill--or .pill-dot { background: rgba(255,220,120,.8); }

/* Pill Membre — rouge */
.pill--rouge {
  background: linear-gradient(135deg, rgba(60,10,6,.85) 0%, rgba(120,28,16,.75) 45%, rgba(160,40,24,.65) 100%);
  border: 1px solid rgba(194,48,24,.55);
  color: rgba(255,185,170,.95);
  box-shadow: 0 0 8px rgba(194,48,24,.3), inset 0 1px 0 rgba(255,255,255,.08);
}
.pill--rouge .pill-dot { background: rgba(255,150,130,.75); }

/* Badge Admin — doré */
.badge--admin {
  background: rgba(28,18,4,.62);
  box-shadow:
    0 0 0 1.5px rgba(196,160,82,.42),
    0 0 0 3px rgba(196,160,82,.07),
    0 6px 28px rgba(184,136,42,.22),
    0 2px 8px rgba(0,0,0,.65);
}
.badge--admin:hover {
  box-shadow:
    0 0 0 1.5px rgba(212,168,67,.7),
    0 0 0 4px rgba(196,160,82,.12),
    0 10px 36px rgba(184,136,42,.36),
    0 2px 8px rgba(0,0,0,.7);
}
.badge--admin .pseudo { color: rgba(255,228,148,.95); }
.badge--admin .av img {
  box-shadow:
    0 0 0 1.5px rgba(196,160,82,.75),
    0 0 10px rgba(184,136,42,.4);
}

/* Badge Membre — rouge */
.badge--membre {
  background: rgba(32,6,4,.62);
  box-shadow:
    0 0 0 1.5px rgba(194,48,24,.42),
    0 0 0 3px rgba(194,48,24,.07),
    0 6px 28px rgba(194,48,24,.2),
    0 2px 8px rgba(0,0,0,.6);
}
.badge--membre:hover {
  box-shadow:
    0 0 0 1.5px rgba(212,58,32,.68),
    0 0 0 4px rgba(194,48,24,.12),
    0 10px 36px rgba(194,48,24,.32),
    0 2px 8px rgba(0,0,0,.7);
}
.badge--membre .pseudo { color: rgba(255,185,168,.92); }
.badge--membre .av img {
  box-shadow:
    0 0 0 1.5px rgba(194,48,24,.72),
    0 0 10px rgba(194,48,24,.4);
}


/* ══════════════════════════════════════════
   ▸ VARIANTE A — Icône seule + pseudo + rôle
     130 × 34 px  ·  label inline coloré
══════════════════════════════════════════ */
.sm-a {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  width: 130px;
  height: 34px;
  border-radius: 999px;
  padding: 0 12px 0 5px;
  overflow: hidden;
  cursor: default;
  transition: transform .22s ease, box-shadow .28s ease;
}
.sm-a:hover { transform: translateY(-2px); }
.sm-a::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
  z-index: 3; pointer-events: none;
}
.sm-a .av { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; z-index: 2; }
.sm-a .av img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: block; }
.sm-a .info { display: flex; flex-direction: column; gap: 2px; z-index: 2; min-width: 0; overflow: hidden; }
.sm-a .pseudo {
  font-family: var(--f-title);
  font-size: 0.52rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1;
}
.sm-a .role {
  font-family: var(--f-display);
  font-size: 0.44rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1;
  white-space: nowrap;
  opacity: 0.75;
}

/* A — Admin doré */
.sm-a--admin {
  background: rgba(28,18,4,.68);
  box-shadow:
    0 0 0 1px rgba(196,160,82,.45),
    0 4px 18px rgba(184,136,42,.22),
    0 2px 6px rgba(0,0,0,.6);
}
.sm-a--admin:hover {
  box-shadow:
    0 0 0 1px rgba(212,168,67,.72),
    0 6px 24px rgba(184,136,42,.36),
    0 2px 6px rgba(0,0,0,.65);
}
.sm-a--admin .pseudo { color: rgba(255,228,148,.95); }
.sm-a--admin .role   { color: rgba(212,168,67,.82); }
.sm-a--admin .av img {
  box-shadow:
    0 0 0 1.5px rgba(196,160,82,.78),
    0 0 8px rgba(184,136,42,.42);
}

/* A — Membre rouge */
.sm-a--membre {
  background: rgba(32,6,4,.68);
  box-shadow:
    0 0 0 1px rgba(194,48,24,.45),
    0 4px 18px rgba(194,48,24,.2),
    0 2px 6px rgba(0,0,0,.6);
}
.sm-a--membre:hover {
  box-shadow:
    0 0 0 1px rgba(212,58,32,.72),
    0 6px 24px rgba(194,48,24,.34),
    0 2px 6px rgba(0,0,0,.65);
}
.sm-a--membre .pseudo { color: rgba(255,185,168,.95); }
.sm-a--membre .role   { color: rgba(212,70,40,.82); }
.sm-a--membre .av img {
  box-shadow:
    0 0 0 1.5px rgba(194,48,24,.78),
    0 0 8px rgba(194,48,24,.42);
}

</style>
</head>
<body>

  <!-- ════════════════════
       BADGE 48 px — FORMAT PRINCIPAL
  ════════════════════ -->
  <div class="section-title">Format principal — h 48 px</div>
  <div class="row">
    <div class="wrap">
      <div class="badge badge--admin">
        <div class="av"><img src="https://i.pravatar.cc/72?img=59" alt="Seb le Fourbe"></div>
        <div class="info">
          <span class="pseudo">Seb le Fourbe</span>
          <span class="pill pill--or"><span class="pill-dot"></span>Ciné Délices</span>
        </div>
      </div>
      <span class="caption">Admin</span>
      <span class="dim">h 48 px</span>
    </div>
    <div class="wrap">
      <div class="badge badge--membre">
        <div class="av"><img src="https://i.pravatar.cc/72?img=44" alt="Sara M."></div>
        <div class="info">
          <span class="pseudo">Sara M.</span>
          <span class="pill pill--rouge"><span class="pill-dot"></span>Critique en Herbe</span>
        </div>
      </div>
      <span class="caption">Membre</span>
      <span class="dim">h 48 px</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- ════════════════════
       VARIANTE A — 130×34 px
       Pseudo + rôle inline (no pill)
  ════════════════════ -->
  <div class="section-title">Variante A — 130 × 34 px</div>
  <div class="variant-label">Pseudo + rôle en deux lignes · pill supprimée</div>
  <div class="row">
    <div class="wrap">
      <div class="sm-a sm-a--admin">
        <div class="av"><img src="https://i.pravatar.cc/72?img=59" alt="Seb le Fourbe"></div>
        <div class="info">
          <span class="pseudo">Seb le Fourbe</span>
          <span class="role">Admin</span>
        </div>
      </div>
      <span class="caption">Admin</span>
    </div>
    <div class="wrap">
      <div class="sm-a sm-a--membre">
        <div class="av"><img src="https://i.pravatar.cc/72?img=44" alt="Sara M."></div>
        <div class="info">
          <span class="pseudo">Sara M.</span>
          <span class="role">Critique en Herbe</span>
        </div>
      </div>
      <span class="caption">Membre</span>
    </div>
  </div>

</body>
</html>
