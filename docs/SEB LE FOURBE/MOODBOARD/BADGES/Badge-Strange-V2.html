<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Doctor Strange Ultime — CSS Only</title>

    <style>
      /* ════════════════════════════════════════════════════════════════════
   RESET
════════════════════════════════════════════════════════════════════ */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ════════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   Tout est centralisé ici. Pour changer la palette, modifier uniquement
   cette section. Les variables hover sont surchargées dans .badge:hover.
════════════════════════════════════════════════════════════════════ */
      :root {
        --bg: #020c07;

        /* ── Palette repos : vert mystique ── */
        --c-ring: #3fe0a1; /* anneaux principaux */
        --c-ring-dim: #2bb673; /* anneaux secondaires */
        --c-glyph: #a6ffd8; /* texte glyphes */
        --c-star: #3fe0a1; /* étoile */
        --c-photo-bdr: rgba(63, 224, 161, 0.6);
        --c-halo: rgba(63, 224, 161, 0.12);
        --c-smoke: rgba(63, 224, 161, 0.18);
        --c-spark1: rgba(166, 255, 216, 0.9);
        --c-spark2: rgba(63, 224, 161, 0.7);

        /* ── Durées : réglables sans toucher aux keyframes ── */
        --dur-r1: 23s;
        --dur-r2: 13s;
        --dur-rb: 42s;
        --dur-r3: 17s;
        --dur-r4: 31s;
        --dur-sqa: 15s;
        --dur-sqb: 21s;

        /* Fontes */
        font-family: "Georgia", "Times New Roman", serif;
      }

      /* ════════════════════════════════════════════════════════════════════
   PAGE
════════════════════════════════════════════════════════════════════ */
      body {
        background: var(--bg);
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 39px,
            rgba(63, 224, 161, 0.018) 40px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 39px,
            rgba(63, 224, 161, 0.018) 40px
          );
        min-height: 100vh;
        display: flex;
        flex-wrap: wrap;
        gap: 72px;
        justify-content: center;
        align-items: center;
        padding: 80px 40px;
      }

      .page-title {
        width: 100%;
        text-align: center;
        color: var(--c-ring);
        font: 8px/1 monospace;
        letter-spacing: 0.7em;
        text-transform: uppercase;
        opacity: 0.25;
        margin-bottom: -40px;
      }

      .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .slot-label {
        color: rgba(63, 224, 161, 0.2);
        font: 7px/1 monospace;
        letter-spacing: 0.5em;
        text-transform: uppercase;
      }

      /* ════════════════════════════════════════════════════════════════════
   BADGE — CONTENEUR PRINCIPAL
   overflow:hidden = verrou absolu. Aucun pixel ne déborde.
   border-radius:50% = le bounding-box est le cercle lui-même.
════════════════════════════════════════════════════════════════════ */
      .badge {
        position: relative;
        border-radius: 50%;
        overflow: hidden; /* ← VERROU */
        cursor: pointer;

        /* Variables hover (surchargées au :hover) */
        --c-ring: #3fe0a1;
        --c-ring-dim: #2bb673;
        --c-glyph: #a6ffd8;
        --c-star: #3fe0a1;
        --c-photo-bdr: rgba(63, 224, 161, 0.6);
        --c-halo: rgba(63, 224, 161, 0.12);
        --c-smoke: rgba(63, 224, 161, 0.18);
        --c-spark1: rgba(166, 255, 216, 0.9);
        --c-spark2: rgba(63, 224, 161, 0.7);
        --dur-r1: 23s;
        --dur-r2: 13s;
        --dur-rb: 42s;
        --dur-r3: 17s;
        --dur-r4: 31s;
        --dur-sqa: 15s;
        --dur-sqb: 21s;
      }

      /* ── Hover : bascule vers palette orange Strange ─────────────────── */
      .badge:hover {
        --c-ring: #fd6b04;
        --c-ring-dim: #d94e00;
        --c-glyph: #fda04a;
        --c-star: #fd6b04;
        --c-photo-bdr: rgba(253, 107, 4, 0.7);
        --c-halo: rgba(253, 107, 4, 0.18);
        --c-smoke: rgba(253, 107, 4, 0.22);
        --c-spark1: rgba(253, 190, 80, 0.95);
        --c-spark2: rgba(253, 107, 4, 0.8);
        /* Accélération des anneaux */
        --dur-r1: 9s;
        --dur-r2: 6s;
        --dur-rb: 18s;
        --dur-r3: 8s;
        --dur-r4: 14s;
        --dur-sqa: 7s;
        --dur-sqb: 10s;
      }

      /* ════════════════════════════════════════════════════════════════════
   PHOTO
════════════════════════════════════════════════════════════════════ */
      .badge__photo {
        position: absolute;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 10%;
        z-index: 20;
        border: 2px solid var(--c-photo-bdr);
        transition:
          border-color 0.5s ease,
          box-shadow 0.5s ease;
        /* Halo inset : ne déborde jamais */
        box-shadow: inset 0 0 10px var(--c-halo);
      }
      .badge:hover .badge__photo {
        box-shadow:
          inset 0 0 18px var(--c-halo),
          inset 0 0 6px rgba(255, 255, 255, 0.08);
      }

      /* ════════════════════════════════════════════════════════════════════
   SVG COUCHE 1 — anneaux + glyphes (z=5)
   SVG COUCHE 2 — étoile overlay devant photo (z=25)
════════════════════════════════════════════════════════════════════ */
      .badge__svg-base,
      .badge__svg-over {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: hidden; /* second verrou pour le SVG */
      }
      .badge__svg-base {
        z-index: 5;
      }
      .badge__svg-over {
        z-index: 25;
      }

      /* ════════════════════════════════════════════════════════════════════
   KEYFRAMES ROTATION
════════════════════════════════════════════════════════════════════ */
      @keyframes cw {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ccw {
        to {
          transform: rotate(-360deg);
        }
      }

      /* ════════════════════════════════════════════════════════════════════
   KEYFRAMES RESPIRATIONS / PULSATIONS
════════════════════════════════════════════════════════════════════ */
      @keyframes breathe-slow {
        0%,
        100% {
          opacity: 0.92;
        }
        50% {
          opacity: 0.55;
        }
      }
      @keyframes breathe-fast {
        0%,
        100% {
          opacity: 0.88;
        }
        50% {
          opacity: 0.42;
        }
      }
      @keyframes glyph-flicker {
        0%,
        100% {
          opacity: 0.85;
        }
        14% {
          opacity: 1;
        }
        19% {
          opacity: 0.52;
        }
        37% {
          opacity: 0.9;
        }
        54% {
          opacity: 0.7;
        }
        69% {
          opacity: 1;
        }
        81% {
          opacity: 0.48;
        }
      }
      @keyframes star-pulse-a {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 0.9;
        }
      }
      @keyframes star-pulse-b {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.85;
        }
      }

      /* ── Anneau fractal ring3 : oscillation stroke-width via filter ── */
      /* Note : stroke-width n'est pas directement animable via custom props
   en SVG cross-browser. On simule l'effet via opacity + scale très
   subtil sur le groupe, sans modifier le rayon. */
      @keyframes fractal-pulse {
        0%,
        100% {
          opacity: 0.72;
          filter: drop-shadow(0 0 0.5px var(--c-ring));
        }
        40% {
          opacity: 1;
          filter: drop-shadow(0 0 1.5px var(--c-ring));
        }
        70% {
          opacity: 0.82;
          filter: drop-shadow(0 0 0.8px var(--c-ring));
        }
      }

      /* ── Distorsion temporelle (time-ripple) autour de la photo ── */
      @keyframes time-ripple {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: 60;
        }
      }

      /* ════════════════════════════════════════════════════════════════════
   SPARKS CSS-ONLY
   Technique : pseudo-éléments + clip-path + radial-gradient + keyframes.
   8 sparks par badge, positions décalées via animation-delay.
   Confinés dans le cercle via overflow:hidden du .badge.
════════════════════════════════════════════════════════════════════ */
      @keyframes spark-fly-1 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.9;
        }
        100% {
          transform: translate(28px, -52px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-2 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.85;
        }
        100% {
          transform: translate(-22px, -58px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-3 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.9;
        }
        100% {
          transform: translate(55px, -8px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-4 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50px, 20px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-5 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.88;
        }
        100% {
          transform: translate(18px, 55px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-6 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.75;
        }
        100% {
          transform: translate(-30px, -45px) scale(0.08);
          opacity: 0;
        }
      }
      @keyframes spark-fly-7 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.9;
        }
        100% {
          transform: translate(42px, 35px) scale(0.12);
          opacity: 0;
        }
      }
      @keyframes spark-fly-8 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.7;
        }
        100% {
          transform: translate(-10px, 60px) scale(0.08);
          opacity: 0;
        }
      }
      @keyframes spark-fly-9 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.85;
        }
        100% {
          transform: translate(60px, -18px) scale(0.1);
          opacity: 0;
        }
      }
      @keyframes spark-fly-10 {
        0% {
          transform: translate(0px, 0px) scale(1);
          opacity: 0.8;
        }
        100% {
          transform: translate(-48px, -30px) scale(0.1);
          opacity: 0;
        }
      }

      /* Spawning des sparks : apparition répétée à intervalles aléatoires */
      @keyframes spark-spawn {
        0%,
        8% {
          opacity: 1;
        }
        80%,
        100% {
          opacity: 0;
        }
      }

      .badge__sparks {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        /* Les sparks sont visibles uniquement quand hover grâce à opacity 0→1 */
      }

      /* Chaque spark = un span.spark positionné sur un anneau */
      .spark {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--c-spark1);
        box-shadow: 0 0 2px var(--c-spark2);
        opacity: 0;
        /* Durée + délai propres à chaque spark */
      }

      /* Positions de spawn sur les anneaux (r ≈ 92–124 en espace 320px viewBox,
   scalées proportionnellement — pour 380px : ×(380/320)=1.1875 ≈ ~116px,
   pour 260px : ×0.8125 ≈ ~95px, pour 140px : ×0.4375 ≈ ~55px.
   On utilise % pour la compatibilité multi-taille. */
      /* ring1 r=92/160 = 57.5% du rayon → spawn en haut, droite, bas, gauche */
      .spark:nth-child(1) {
        top: 8.75%;
        left: 50%;
        animation:
          spark-spawn 2.1s 0s infinite,
          spark-fly-1 2.1s 0s infinite;
      }
      .spark:nth-child(2) {
        top: 50%;
        left: 91.25%;
        animation:
          spark-spawn 2.4s 0.3s infinite,
          spark-fly-2 2.4s 0.3s infinite;
      }
      .spark:nth-child(3) {
        top: 91.25%;
        left: 50%;
        animation:
          spark-spawn 1.9s 0.7s infinite,
          spark-fly-3 1.9s 0.7s infinite;
      }
      .spark:nth-child(4) {
        top: 50%;
        left: 8.75%;
        animation:
          spark-spawn 2.6s 1.1s infinite,
          spark-fly-4 2.6s 1.1s infinite;
      }
      /* ring3 r=124/160 = 77.5% → diagonales */
      .spark:nth-child(5) {
        top: 17%;
        left: 77%;
        animation:
          spark-spawn 2.2s 0.5s infinite,
          spark-fly-5 2.2s 0.5s infinite;
      }
      .spark:nth-child(6) {
        top: 83%;
        left: 23%;
        animation:
          spark-spawn 2.8s 0.9s infinite,
          spark-fly-6 2.8s 0.9s infinite;
      }
      .spark:nth-child(7) {
        top: 17%;
        left: 23%;
        animation:
          spark-spawn 2s 1.5s infinite,
          spark-fly-7 2s 1.5s infinite;
      }
      .spark:nth-child(8) {
        top: 83%;
        left: 77%;
        animation:
          spark-spawn 2.5s 0.2s infinite,
          spark-fly-8 2.5s 0.2s infinite;
      }
      .spark:nth-child(9) {
        top: 30%;
        left: 93%;
        animation:
          spark-spawn 1.8s 1.8s infinite,
          spark-fly-9 1.8s 1.8s infinite;
      }
      .spark:nth-child(10) {
        top: 70%;
        left: 7%;
        animation:
          spark-spawn 2.3s 0.6s infinite,
          spark-fly-10 2.3s 0.6s infinite;
      }

      /* Au hover : sparks plus lumineux, légèrement plus grands */
      .badge:hover .spark {
        width: 4px;
        height: 4px;
        background: var(--c-spark1);
        box-shadow:
          0 0 4px var(--c-spark2),
          0 0 8px rgba(255, 200, 80, 0.3);
        animation-duration: 0.9s !important; /* accélération au hover */
      }

      /* ════════════════════════════════════════════════════════════════════
   BRUME ASCENDANTE CSS-ONLY
   Technique : particules pseudo-éléments + radial-gradient + float up
   Confinée dans .badge (overflow:hidden).
   Limitée à la zone haute (translate de départ centré-haut).
════════════════════════════════════════════════════════════════════ */
      @keyframes smoke-rise-1 {
        0% {
          transform: translate(-12px, 0) scale(0.6);
          opacity: 0.22;
        }
        100% {
          transform: translate(-18px, -45px) scale(1.4);
          opacity: 0;
        }
      }
      @keyframes smoke-rise-2 {
        0% {
          transform: translate(8px, 0) scale(0.5);
          opacity: 0.18;
        }
        100% {
          transform: translate(14px, -50px) scale(1.6);
          opacity: 0;
        }
      }
      @keyframes smoke-rise-3 {
        0% {
          transform: translate(-4px, 0) scale(0.7);
          opacity: 0.25;
        }
        100% {
          transform: translate(4px, -42px) scale(1.3);
          opacity: 0;
        }
      }
      @keyframes smoke-rise-4 {
        0% {
          transform: translate(16px, 0) scale(0.55);
          opacity: 0.2;
        }
        100% {
          transform: translate(22px, -48px) scale(1.5);
          opacity: 0;
        }
      }
      @keyframes smoke-rise-5 {
        0% {
          transform: translate(-20px, 0) scale(0.6);
          opacity: 0.16;
        }
        100% {
          transform: translate(-26px, -44px) scale(1.2);
          opacity: 0;
        }
      }
      @keyframes smoke-rise-6 {
        0% {
          transform: translate(2px, 0) scale(0.65);
          opacity: 0.22;
        }
        100% {
          transform: translate(-6px, -52px) scale(1.4);
          opacity: 0;
        }
      }

      .badge__smoke {
        position: absolute;
        pointer-events: none;
        z-index: 9;
        /* Spawn en zone haute du cercle, légèrement sous le sommet des anneaux */
        bottom: 55%;
        left: 50%;
        transform: translateX(-50%);
        width: 1px;
        height: 1px;
      }

      .smoke-p {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        /* Taille et couleur via variables héritées du .badge */
        background: radial-gradient(circle, var(--c-smoke) 0%, transparent 70%);
      }

      .smoke-p:nth-child(1) {
        width: 14px;
        height: 14px;
        margin: -7px;
        animation: smoke-rise-1 4.2s 0s infinite ease-out;
      }
      .smoke-p:nth-child(2) {
        width: 12px;
        height: 12px;
        margin: -6px;
        animation: smoke-rise-2 3.8s 0.8s infinite ease-out;
      }
      .smoke-p:nth-child(3) {
        width: 16px;
        height: 16px;
        margin: -8px;
        animation: smoke-rise-3 4.6s 1.5s infinite ease-out;
      }
      .smoke-p:nth-child(4) {
        width: 10px;
        height: 10px;
        margin: -5px;
        animation: smoke-rise-4 3.5s 2.2s infinite ease-out;
      }
      .smoke-p:nth-child(5) {
        width: 13px;
        height: 13px;
        margin: -6.5px;
        animation: smoke-rise-5 4.9s 0.4s infinite ease-out;
      }
      .smoke-p:nth-child(6) {
        width: 11px;
        height: 11px;
        margin: -5.5px;
        animation: smoke-rise-6 4.1s 3s infinite ease-out;
      }

      /* Au hover : brume plus opaque, monte plus vite */
      .badge:hover .smoke-p {
        animation-duration: 2.2s !important;
      }
      .badge:hover .smoke-p:nth-child(1) {
        animation-duration: 2s !important;
      }
      .badge:hover .smoke-p:nth-child(2) {
        animation-duration: 1.8s !important;
      }
      .badge:hover .smoke-p:nth-child(3) {
        animation-duration: 2.3s !important;
      }
      .badge:hover .smoke-p:nth-child(4) {
        animation-duration: 1.7s !important;
      }
      .badge:hover .smoke-p:nth-child(5) {
        animation-duration: 2.1s !important;
      }
      .badge:hover .smoke-p:nth-child(6) {
        animation-duration: 1.9s !important;
      }

      /* ════════════════════════════════════════════════════════════════════
   SMALL (140px) — réduction charge animation pour fluidité
   Moins de sparks visibles, brume plus légère.
════════════════════════════════════════════════════════════════════ */
      .badge--sm .spark:nth-child(n + 7) {
        display: none;
      } /* 6 sparks max */
      .badge--sm .smoke-p:nth-child(n + 4) {
        display: none;
      } /* 3 fumées max */
      .badge--sm .badge__svg-base,
      .badge--sm .badge__svg-over {
        will-change: transform;
      }

      /* ════════════════════════════════════════════════════════════════════
   PERFORMANCE — will-change minimal, GPU hint uniquement sur SVG
════════════════════════════════════════════════════════════════════ */
      .badge__svg-base svg,
      .badge__svg-over svg {
        will-change: contents; /* hinted mais pas forcé */
      }

      /* Tailles responsives */
      .badge--lg {
        width: 380px;
        height: 380px;
      }
      .badge--md {
        width: 260px;
        height: 260px;
      }
      .badge--sm {
        width: 140px;
        height: 140px;
      }
    </style>
  </head>
  <body>
    <p class="page-title">Ciné Délices · Badge Arcane · Ultime · CSS Only</p>

    <!-- ═══ LARGE 380px ═══════════════════════════════════════════════ -->
    <div class="slot">
      <div class="badge badge--lg" aria-label="Badge Doctor Strange" role="img">
        <!-- Sparks directionnels -->
        <div class="badge__sparks" aria-hidden="true">
          <span class="spark"></span><span class="spark"></span>
          <span class="spark"></span><span class="spark"></span>
          <span class="spark"></span><span class="spark"></span>
          <span class="spark"></span><span class="spark"></span>
          <span class="spark"></span><span class="spark"></span>
        </div>

        <!-- Brume ascendante -->
        <div class="badge__smoke" aria-hidden="true">
          <span class="smoke-p"></span><span class="smoke-p"></span>
          <span class="smoke-p"></span><span class="smoke-p"></span>
          <span class="smoke-p"></span><span class="smoke-p"></span>
        </div>

        <!-- Photo -->
        <img
          class="badge__photo"
          src="https://i.postimg.cc/JhnNTs7C/strange.jpg"
          alt="Doctor Strange"
          style="width: 192px; height: 192px; top: 94px; left: 94px"
          onerror="
            this.src =
              'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22192%22 height=%22192%22%3E%3Crect fill=%22%23111%22 width=%22100%25%22 height=%22100%25%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%2300ff88%22 font-size=%2280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3E✦%3C/text%3E%3C/svg%3E'
          "
        />

        <!-- SVG Base : anneaux + glyphes -->
        <div
          class="badge__svg-base"
          style="width: 380px; height: 380px"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 320 320"
            width="380"
            height="380"
            xmlns="http://www.w3.org/2000/svg"
            style="overflow: hidden; display: block"
          >
            <defs>
              <!-- Filtres INTERNES : blur confiné au viewBox -->
              <filter id="gf-lg" x="0%" y="0%" width="100%" height="100%">
                <feGaussianBlur stdDeviation="1.2" result="b" />
