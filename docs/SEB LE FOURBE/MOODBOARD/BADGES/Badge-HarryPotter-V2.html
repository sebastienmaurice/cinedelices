<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Harry Potter — Patronus AAA — CSS Only</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: #03050a;
        background-image: radial-gradient(
          ellipse 80% 55% at 50% 45%,
          rgba(80, 160, 255, 0.055) 0%,
          transparent 65%
        );
        display: flex;
        flex-wrap: wrap;
        gap: 90px;
        justify-content: center;
        align-items: center;
        padding: 100px 60px;
      }

      .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .slot-label {
        color: rgba(123, 211, 255, 0.18);
        font: 7px/1 monospace;
        letter-spacing: 0.55em;
        text-transform: uppercase;
      }

      /* ══════════════════════════════════════════════════
   BADGE
══════════════════════════════════════════════════ */
      .badge {
        position: relative;
        border-radius: 50%;
        cursor: pointer;
        isolation: isolate;

        --sz: 340px;
        --avatar-sz: 218px;
        --R: 148px;
        --orb-sz: 22px;
        --T: 6.5s;
        --T-pulse: 2.4s;
        /* Halo interaction speed */
        --T-halo: 3.2s;

        width: var(--sz);
        height: var(--sz);
      }
      .badge--lg {
        --sz: 340px;
        --avatar-sz: 218px;
        --R: 148px;
        --orb-sz: 22px;
      }
      .badge--md {
        --sz: 230px;
        --avatar-sz: 148px;
        --R: 100px;
        --orb-sz: 16px;
      }
      .badge--sm {
        --sz: 130px;
        --avatar-sz: 84px;
        --R: 56px;
        --orb-sz: 11px;
      }

      /* ══════════════════════════════════════════════════
   AVATAR
══════════════════════════════════════════════════ */
      .avatar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: var(--avatar-sz);
        height: var(--avatar-sz);
        border-radius: 50%;
        object-fit: cover;
        object-position: center top;
        z-index: 10;
        box-shadow:
          0 0 0 1.5px rgba(180, 230, 255, 0.4),
          0 0 20px rgba(100, 190, 255, 0.22),
          inset 0 0 30px rgba(0, 5, 15, 0.6);
        transition: box-shadow 0.3s ease;
      }

      /* ══════════════════════════════════════════════════
   HALO AMBIANT — interagit avec la traînée
   Il pulse EN PHASE avec l'orbite : quand l'orbe
   passe devant (0°), le halo s'illumine légèrement
   côté droit ; le reste du temps il respire doucement.
   Technique : deux couches superposées.
══════════════════════════════════════════════════ */
      .halo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 2;
        pointer-events: none;
        /* Gradient légèrement asymétrique — réagit à l'orbe */
        background: radial-gradient(
          circle at 50% 50%,
          rgba(100, 190, 255, 0.1) 0%,
          rgba(100, 190, 255, 0.04) 42%,
          transparent 68%
        );
        animation:
          halo-orb-sync var(--T) ease-in-out infinite,
          halo-breathe var(--T-halo) ease-in-out infinite;
      }
      /* Le halo "suit" l'orbe : quand l'orbe est à droite
   le centre lumineux se décale légèrement */
      @keyframes halo-orb-sync {
        0% {
          background: radial-gradient(
            circle at 76% 50%,
            rgba(130, 210, 255, 0.18) 0%,
            rgba(100, 190, 255, 0.06) 35%,
            transparent 62%
          );
        }
        25% {
          background: radial-gradient(
            circle at 50% 76%,
            rgba(120, 205, 255, 0.13) 0%,
            rgba(100, 190, 255, 0.05) 38%,
            transparent 64%
          );
        }
        50% {
          background: radial-gradient(
            circle at 24% 50%,
            rgba(115, 200, 255, 0.16) 0%,
            rgba(100, 190, 255, 0.05) 36%,
            transparent 62%
          );
        }
        75% {
          background: radial-gradient(
            circle at 50% 24%,
            rgba(125, 208, 255, 0.13) 0%,
            rgba(100, 190, 255, 0.05) 38%,
            transparent 64%
          );
        }
        100% {
          background: radial-gradient(
            circle at 76% 50%,
            rgba(130, 210, 255, 0.18) 0%,
            rgba(100, 190, 255, 0.06) 35%,
            transparent 62%
          );
        }
      }
      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.07);
        }
      }

      /* ══════════════════════════════════════════════════
   ANNEAUX SVG
══════════════════════════════════════════════════ */
      .rings {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        border-radius: 50%;
        overflow: hidden;
      }

      /* ══════════════════════════════════════════════════
   SYSTÈME ORBITAL
══════════════════════════════════════════════════ */
      .orbital {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 22;
        animation: spin var(--T) linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* ══════════════════════════════════════════════════
   ORBE — floue, aveuglante
══════════════════════════════════════════════════ */
      .orb {
        position: absolute;
        top: 50%;
        left: calc(50% + var(--R));
        transform: translate(-50%, -50%);
        width: var(--orb-sz);
        height: var(--orb-sz);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #ffffff 0%,
          rgba(230, 248, 255, 0.9) 30%,
          rgba(160, 225, 255, 0.5) 65%,
          transparent 100%
        );
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.4) calc(var(--orb-sz) * 0.6)
            rgba(255, 255, 255, 1),
          0 0 calc(var(--orb-sz) * 1.2) calc(var(--orb-sz) * 0.9)
            rgba(220, 245, 255, 0.92),
          0 0 calc(var(--orb-sz) * 2.8) calc(var(--orb-sz) * 1.1)
            rgba(123, 211, 255, 0.78),
          0 0 calc(var(--orb-sz) * 5) calc(var(--orb-sz) * 1.3)
            rgba(100, 190, 255, 0.52),
          0 0 calc(var(--orb-sz) * 9) calc(var(--orb-sz) * 1.5)
            rgba(80, 170, 255, 0.25),
          0 0 calc(var(--orb-sz) * 15) calc(var(--orb-sz) * 1.8)
            rgba(60, 150, 255, 0.1);
        filter: blur(calc(var(--orb-sz) * 0.32));
        animation: orb-pulse var(--T-pulse) ease-in-out infinite;
        z-index: 3;
      }
      @keyframes orb-pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.35);
          opacity: 0.85;
        }
      }

      /* ══════════════════════════════════════════════════
   TRAÎNÉE DE FUMÉE
   Nouvelle : oscillation légère sur les particules
   du ventre (P4-P7) via animation translateY oscillante
   superposée → donne un effet "brume vivante".
══════════════════════════════════════════════════ */
      .tp {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        transform-origin: 0 0;
      }
      .tp > span {
        position: absolute;
        border-radius: 50%;
        top: 0;
        left: var(--R);
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0;
        transform-origin: center center;
      }

      .tp:nth-child(2) {
        transform: rotate(-5deg);
      }
      .tp:nth-child(2) > span {
        width: calc(var(--orb-sz) * 2.2);
        height: calc(var(--orb-sz) * 2.2);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(220, 245, 255, 0.75) 35%,
          rgba(180, 230, 255, 0.4) 65%,
          transparent 85%
        );
        filter: blur(calc(var(--orb-sz) * 0.3));
        animation: t1 var(--T) linear infinite;
      }
      .tp:nth-child(3) {
        transform: rotate(-11deg);
      }
      .tp:nth-child(3) > span {
        width: calc(var(--orb-sz) * 3);
        height: calc(var(--orb-sz) * 2.6);
        background: radial-gradient(
          ellipse,
          rgba(245, 253, 255, 0.88) 0%,
          rgba(200, 240, 255, 0.62) 38%,
          rgba(150, 215, 255, 0.3) 65%,
          transparent 82%
        );
        filter: blur(calc(var(--orb-sz) * 0.38));
        animation: t2 var(--T) linear infinite;
      }
      .tp:nth-child(4) {
        transform: rotate(-19deg);
      }
      .tp:nth-child(4) > span {
        width: calc(var(--orb-sz) * 4);
        height: calc(var(--orb-sz) * 3.2);
        background: radial-gradient(
          ellipse,
          rgba(235, 250, 255, 0.78) 0%,
          rgba(185, 232, 255, 0.52) 40%,
          rgba(135, 208, 255, 0.22) 65%,
          transparent 80%
        );
        filter: blur(calc(var(--orb-sz) * 0.48));
        animation: t3 var(--T) linear infinite;
      }
      /* P4-P7 : ventre — oscillation légère */
      .tp:nth-child(5) {
        transform: rotate(-29deg);
      }
      .tp:nth-child(5) > span {
        width: calc(var(--orb-sz) * 5.2);
        height: calc(var(--orb-sz) * 3.8);
        background: radial-gradient(
          ellipse,
          rgba(222, 246, 255, 0.68) 0%,
          rgba(170, 225, 255, 0.42) 40%,
          rgba(120, 200, 255, 0.16) 64%,
          transparent 78%
        );
        filter: blur(calc(var(--orb-sz) * 0.62));
        animation:
          t4 var(--T) linear infinite,
          mist-wobble 2.1s ease-in-out infinite;
      }
      .tp:nth-child(6) {
        transform: rotate(-41deg);
      }
      .tp:nth-child(6) > span {
        width: calc(var(--orb-sz) * 6.5);
        height: calc(var(--orb-sz) * 4.8);
        background: radial-gradient(
          ellipse,
          rgba(208, 242, 255, 0.56) 0%,
          rgba(155, 218, 255, 0.33) 40%,
          rgba(110, 192, 255, 0.12) 63%,
          transparent 76%
        );
        filter: blur(calc(var(--orb-sz) * 0.78));
        animation:
          t5 var(--T) linear infinite,
          mist-wobble 2.7s ease-in-out infinite 0.4s;
      }
      .tp:nth-child(7) {
        transform: rotate(-53deg);
      }
      .tp:nth-child(7) > span {
        width: calc(var(--orb-sz) * 7.5);
        height: calc(var(--orb-sz) * 5.2);
        background: radial-gradient(
          ellipse,
          rgba(192, 238, 255, 0.44) 0%,
          rgba(140, 212, 255, 0.24) 40%,
          rgba(100, 185, 255, 0.08) 62%,
          transparent 74%
        );
        filter: blur(calc(var(--orb-sz) * 0.95));
        animation:
          t6 var(--T) linear infinite,
          mist-wobble 3.1s ease-in-out infinite 0.8s;
      }
      .tp:nth-child(8) {
        transform: rotate(-65deg);
      }
      .tp:nth-child(8) > span {
        width: calc(var(--orb-sz) * 7.2);
        height: calc(var(--orb-sz) * 4.6);
        background: radial-gradient(
          ellipse,
          rgba(175, 232, 255, 0.32) 0%,
          rgba(125, 205, 255, 0.15) 40%,
          transparent 68%
        );
        filter: blur(calc(var(--orb-sz) * 1.15));
        animation:
          t7 var(--T) linear infinite,
          mist-wobble 2.5s ease-in-out infinite 1.2s;
      }
      .tp:nth-child(9) {
        transform: rotate(-76deg);
      }
      .tp:nth-child(9) > span {
        width: calc(var(--orb-sz) * 6);
        height: calc(var(--orb-sz) * 3.6);
        background: radial-gradient(
          ellipse,
          rgba(158, 226, 255, 0.22) 0%,
          rgba(110, 196, 255, 0.09) 38%,
          transparent 64%
        );
        filter: blur(calc(var(--orb-sz) * 1.4));
        animation: t8 var(--T) linear infinite;
      }
      .tp:nth-child(10) {
        transform: rotate(-86deg);
      }
      .tp:nth-child(10) > span {
        width: calc(var(--orb-sz) * 4.5);
        height: calc(var(--orb-sz) * 2.8);
        background: radial-gradient(
          ellipse,
          rgba(140, 218, 255, 0.14) 0%,
          transparent 58%
        );
        filter: blur(calc(var(--orb-sz) * 1.7));
        animation: t9 var(--T) linear infinite;
      }
      /* P10-P14 : micro-points — BOOST visibilité */
      .tp:nth-child(11) {
        transform: rotate(-95deg);
      }
      .tp:nth-child(11) > span {
        width: calc(var(--orb-sz) * 2);
        height: calc(var(--orb-sz) * 2);
        background: radial-gradient(
          circle,
          rgba(240, 252, 255, 0.92) 0%,
          rgba(200, 240, 255, 0.6) 35%,
          rgba(150, 220, 255, 0.25) 60%,
          transparent 80%
        );
        filter: blur(calc(var(--orb-sz) * 0.25));
        animation: t10 var(--T) linear infinite;
        box-shadow: 0 0 calc(var(--orb-sz) * 0.8) calc(var(--orb-sz) * 0.2)
          rgba(200, 240, 255, 0.5);
      }
      .tp:nth-child(12) {
        transform: rotate(-103deg);
      }
      .tp:nth-child(12) > span {
        width: calc(var(--orb-sz) * 1.5);
        height: calc(var(--orb-sz) * 1.5);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(210, 244, 255, 0.65) 40%,
          rgba(160, 222, 255, 0.3) 65%,
          transparent 82%
        );
        filter: blur(calc(var(--orb-sz) * 0.2));
        animation: t11 var(--T) linear infinite;
        box-shadow: 0 0 calc(var(--orb-sz) * 0.7) calc(var(--orb-sz) * 0.2)
          rgba(180, 235, 255, 0.55);
      }
      .tp:nth-child(13) {
        transform: rotate(-110deg);
      }
      .tp:nth-child(13) > span {
        width: calc(var(--orb-sz) * 1.1);
        height: calc(var(--orb-sz) * 1.1);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(220, 246, 255, 0.6) 42%,
          transparent 78%
        );
        filter: blur(calc(var(--orb-sz) * 0.18));
        animation: t12 var(--T) linear infinite;
        box-shadow: 0 0 calc(var(--orb-sz) * 0.6) calc(var(--orb-sz) * 0.18)
          rgba(180, 235, 255, 0.5);
      }
      .tp:nth-child(14) {
        transform: rotate(-116deg);
      }
      .tp:nth-child(14) > span {
        width: calc(var(--orb-sz) * 0.8);
        height: calc(var(--orb-sz) * 0.8);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(220, 248, 255, 0.5) 45%,
          transparent 80%
        );
        filter: blur(calc(var(--orb-sz) * 0.14));
        animation: t13 var(--T) linear infinite;
        box-shadow: 0 0 calc(var(--orb-sz) * 0.5) calc(var(--orb-sz) * 0.15)
          rgba(190, 238, 255, 0.5);
      }
      .tp:nth-child(15) {
        transform: rotate(-121deg);
      }
      .tp:nth-child(15) > span {
        width: calc(var(--orb-sz) * 0.55);
        height: calc(var(--orb-sz) * 0.55);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.75) 0%,
          rgba(220, 248, 255, 0.4) 50%,
          transparent 80%
        );
        filter: blur(calc(var(--orb-sz) * 0.12));
        animation: t14 var(--T) linear infinite;
        box-shadow: 0 0 calc(var(--orb-sz) * 0.4) calc(var(--orb-sz) * 0.12)
          rgba(190, 238, 255, 0.45);
      }

      /* ══════════════════════════════════════════════════
   ÉTINCELLES MAGIQUES dans la traînée
   6 micro-étincelles à des angles dans la traînée,
   chacune clignote à sa propre fréquence — elles
   apparaissent, scintillent, disparaissent.
   Elles sont sur le même .orbital donc elles tournent
   avec la traînée.
══════════════════════════════════════════════════ */
      .sp {
        position: absolute;
        top: 0;
        left: var(--R);
        border-radius: 50%;
        transform-origin: center center;
        opacity: 0;
        background: #ffffff;
      }

      /* Wrapper angulaire pour chaque étincelle */
      .sw {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        transform-origin: 0 0;
      }

      /* 6 étincelles réparties sur l'arc de la traînée */
      .sw:nth-child(16) {
        transform: rotate(-14deg);
      }
      .sw:nth-child(16) > .sp {
        width: calc(var(--orb-sz) * 0.28);
        height: calc(var(--orb-sz) * 0.28);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.5) rgba(220, 248, 255, 0.95),
          0 0 calc(var(--orb-sz) * 1) rgba(160, 225, 255, 0.6);
        animation: sparkle-a 1.7s ease-in-out infinite;
      }
      .sw:nth-child(17) {
        transform: rotate(-33deg);
      }
      .sw:nth-child(17) > .sp {
        width: calc(var(--orb-sz) * 0.22);
        height: calc(var(--orb-sz) * 0.22);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.45) rgba(200, 244, 255, 0.9),
          0 0 calc(var(--orb-sz) * 0.9) rgba(150, 218, 255, 0.55);
        animation: sparkle-b 2.3s ease-in-out infinite 0.4s;
      }
      .sw:nth-child(18) {
        transform: rotate(-47deg);
      }
      .sw:nth-child(18) > .sp {
        width: calc(var(--orb-sz) * 0.32);
        height: calc(var(--orb-sz) * 0.32);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.55) rgba(230, 250, 255, 0.95),
          0 0 calc(var(--orb-sz) * 1.1) rgba(170, 228, 255, 0.65);
        animation: sparkle-a 1.9s ease-in-out infinite 0.7s;
      }
      .sw:nth-child(19) {
        transform: rotate(-62deg);
      }
      .sw:nth-child(19) > .sp {
        width: calc(var(--orb-sz) * 0.18);
        height: calc(var(--orb-sz) * 0.18);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.4) rgba(215, 246, 255, 0.9),
          0 0 calc(var(--orb-sz) * 0.8) rgba(155, 220, 255, 0.5);
        animation: sparkle-c 2.6s ease-in-out infinite 0.2s;
      }
      .sw:nth-child(20) {
        transform: rotate(-78deg);
      }
      .sw:nth-child(20) > .sp {
        width: calc(var(--orb-sz) * 0.25);
        height: calc(var(--orb-sz) * 0.25);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.48) rgba(225, 249, 255, 0.92),
          0 0 calc(var(--orb-sz) * 1) rgba(165, 224, 255, 0.58);
        animation: sparkle-b 2.1s ease-in-out infinite 1s;
      }
      .sw:nth-child(21) {
        transform: rotate(-92deg);
      }
      .sw:nth-child(21) > .sp {
        width: calc(var(--orb-sz) * 0.2);
        height: calc(var(--orb-sz) * 0.2);
        transform: translate(-50%, -50%);
        box-shadow:
          0 0 calc(var(--orb-sz) * 0.42) rgba(210, 245, 255, 0.88),
          0 0 calc(var(--orb-sz) * 0.85) rgba(150, 216, 255, 0.52);
        animation: sparkle-c 3s ease-in-out infinite 0.6s;
      }

      /* 3 courbes de scintillement différentes */
      @keyframes sparkle-a {
        0%,
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
        15% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
        30% {
          opacity: 0.95;
          transform: translate(-50%, -50%) scale(1.1);
        }
        45% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(0.8);
        }
        55% {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(1.2);
        }
        70% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.3);
        }
      }
      @keyframes sparkle-b {
        0%,
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.15);
        }
        20% {
          opacity: 0.88;
          transform: translate(-50%, -50%) scale(1);
        }
        35% {
          opacity: 0.2;
          transform: translate(-50%, -50%) scale(0.5);
        }
        50% {
          opacity: 0.82;
          transform: translate(-50%, -50%) scale(1.15);
        }
        65% {
          opacity: 0.1;
          transform: translate(-50%, -50%) scale(0.4);
        }
        75% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.1);
        }
      }
      @keyframes sparkle-c {
        0%,
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.1);
        }
        25% {
          opacity: 0.92;
          transform: translate(-50%, -50%) scale(1.05);
        }
        40% {
          opacity: 0.55;
          transform: translate(-50%, -50%) scale(0.7);
        }
        58% {
          opacity: 0.78;
          transform: translate(-50%, -50%) scale(1.1);
        }
        72% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2);
        }
      }

      /* ══════════════════════════════════════════════════
   OSCILLATION DE LA BRUME — keyframe partagé
