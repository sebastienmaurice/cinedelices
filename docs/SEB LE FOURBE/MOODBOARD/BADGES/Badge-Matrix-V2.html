<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Matrix V9 — Monde Réel</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Fond bleu nuit Ciné Délices */
      body {
        min-height: 100vh;
        background: #142234;
        display: flex;
        flex-wrap: wrap;
        gap: 80px;
        justify-content: center;
        align-items: center;
        padding: 100px 60px;
      }

      .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .slot-label {
        color: rgba(0, 255, 65, 0.22);
        font:
          7px/1 "Courier New",
          monospace;
        letter-spacing: 0.55em;
        text-transform: uppercase;
      }

      /* ══════════════════════════════════════════════════
   BADGE
   Pas de border, pas de box-shadow externe.
   Le fondu vers --ink est géré par la vignette CSS.
══════════════════════════════════════════════════ */
      .badge {
        position: relative;
        border-radius: 50%;
        overflow: hidden;
        cursor: pointer;
        /* Pas de border — le badge se fond dans le fond bleu */
      }
      .badge--lg {
        width: 380px;
        height: 380px;
      }
      .badge--md {
        width: 260px;
        height: 260px;
      }
      .badge--sm {
        width: 140px;
        height: 140px;
      }

      /* ── Canvas ── */
      .badge__canvas {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 1;
        display: block;
      }

      /* ── Vignette fondu bords → bleu nuit du site ──
   Gradient radial qui efface les bords du cercle
   et les fond dans le #142234 du fond.
   Remplace totalement le border/ring externe.      */
      .badge__vignette {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 50%,
          transparent 0%,
          transparent 52%,
          rgba(20, 34, 52, 0.4) 65%,
          rgba(20, 34, 52, 0.75) 78%,
          rgba(20, 34, 52, 0.92) 88%,
          rgba(20, 34, 52, 1) 100%
        );
      }

      /* ── Photo — positionnée à 0/0 dans son wrap ── */
      .badge__photo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 10%;
        border: none;
        filter: saturate(0.72) brightness(0.84);
        transition: filter 0.4s ease;
      }

      /* ── Scanlines sur la photo ── */
      .badge__scanlines {
        position: absolute;
        border-radius: 50%;
        z-index: 11;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.1) 2px,
          rgba(0, 0, 0, 0.1) 4px
        );
        opacity: 0.55;
        transition: opacity 0.4s;
      }
      .badge--lg .badge__scanlines {
        width: 186px;
        height: 186px;
        top: 97px;
        left: 97px;
        border-radius: 50%;
      }
      .badge--md .badge__scanlines {
        width: 126px;
        height: 126px;
        top: 67px;
        left: 67px;
        border-radius: 50%;
      }
      .badge--sm .badge__scanlines {
        width: 68px;
        height: 68px;
        top: 36px;
        left: 36px;
        border-radius: 50%;
      }

      /* ── HALO blanc — désactivé, remplacé par la vapeur rouge ── */
      .badge__halo {
        display: none;
      }

      /* ── VAPEUR ROUGE — surchauffe, monte vers le haut au hover ──
   3 volutes indépendantes (.badge__heat + ::before + ::after)
   avec des timing différents pour un effet chaotique naturel.    */
      .badge__heat {
        position: absolute;
        border-radius: 50%;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        /* Volute principale — large, centrée, monte lentement */
        background: radial-gradient(
          ellipse 70% 90% at 50% 80%,
          transparent 0%,
          rgba(160, 8, 0, 0.14) 35%,
          rgba(200, 25, 0, 0.26) 58%,
          rgba(140, 5, 0, 0.14) 78%,
          transparent 100%
        );
        filter: blur(16px);
        transition: opacity 0.7s ease;
      }
      .badge--lg .badge__heat {
        width: 224px;
        height: 250px;
        top: 75px;
        left: 78px;
      }
      .badge--md .badge__heat {
        width: 152px;
        height: 170px;
        top: 50px;
        left: 54px;
      }
      .badge--sm .badge__heat {
        width: 84px;
        height: 92px;
        top: 26px;
        left: 28px;
      }

      .badge:hover .badge__heat {
        opacity: 1;
        animation: heat-main 2.6s ease-in-out infinite;
      }
      @keyframes heat-main {
        0% {
          transform: translateY(0) scaleX(1) scaleY(1);
          filter: blur(16px);
          opacity: 0.65;
        }
        18% {
          transform: translateY(-8px) scaleX(1.07) scaleY(0.96);
          filter: blur(19px);
          opacity: 0.9;
        }
        35% {
          transform: translateY(-4px) scaleX(0.94) scaleY(1.03);
          filter: blur(13px);
          opacity: 0.72;
        }
        52% {
          transform: translateY(-12px) scaleX(1.1) scaleY(0.92);
          filter: blur(22px);
          opacity: 1;
        }
        70% {
          transform: translateY(-6px) scaleX(0.97) scaleY(1.01);
          filter: blur(15px);
          opacity: 0.6;
        }
        85% {
          transform: translateY(-10px) scaleX(1.05) scaleY(0.95);
          filter: blur(20px);
          opacity: 0.85;
        }
        100% {
          transform: translateY(0) scaleX(1) scaleY(1);
          filter: blur(16px);
          opacity: 0.65;
        }
      }

      /* Volute 2 — plus petite, décalée à gauche, rythme différent */
      .badge__heat::before {
        content: "";
        position: absolute;
        inset: 10% 30% 5% 5%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse 80% 110% at 40% 85%,
          transparent 0%,
          rgba(180, 12, 0, 0.18) 40%,
          rgba(220, 35, 0, 0.28) 62%,
          transparent 88%
        );
        filter: blur(12px);
        animation: heat-left 1.9s ease-in-out infinite;
      }
      @keyframes heat-left {
        0% {
          transform: translateY(0) scaleX(1);
          opacity: 0.55;
        }
        25% {
          transform: translateY(-10px) scaleX(0.9);
          opacity: 0.85;
        }
        50% {
          transform: translateY(-5px) scaleX(1.08);
          opacity: 0.5;
        }
        75% {
          transform: translateY(-14px) scaleX(0.95);
          opacity: 0.9;
        }
        100% {
          transform: translateY(0) scaleX(1);
          opacity: 0.55;
        }
      }

      /* Volute 3 — fine, décalée à droite, montée plus rapide */
      .badge__heat::after {
        content: "";
        position: absolute;
        inset: 15% 5% 0% 35%;
        border-radius: 50%;
        background: radial-gradient(
          ellipse 60% 100% at 65% 90%,
          transparent 0%,
          rgba(200, 20, 0, 0.16) 38%,
          rgba(160, 8, 0, 0.22) 65%,
          transparent 90%
        );
        filter: blur(10px);
        animation: heat-right 1.5s ease-in-out infinite;
        animation-delay: 0.4s;
      }
      @keyframes heat-right {
        0% {
          transform: translateY(0) scaleX(1);
          opacity: 0.45;
        }
        30% {
          transform: translateY(-7px) scaleX(1.12);
          opacity: 0.75;
        }
        60% {
          transform: translateY(-13px) scaleX(0.88);
          opacity: 0.4;
        }
        100% {
          transform: translateY(0) scaleX(1);
          opacity: 0.45;
        }
      }

      /* ── HALO ROUGE explosion éclair — gardé pour l'impact ── */
      .badge__photo-ring::before {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse 100% 100% at 50% 50%,
          transparent 52%,
          rgba(180, 15, 0, 0.2) 68%,
          rgba(220, 30, 0, 0.35) 80%,
          rgba(160, 10, 0, 0.15) 92%,
          transparent 100%
        );
        filter: blur(10px);
        transition: opacity 0.4s;
      }
      /* Pas de halo ring au hover normal — uniquement à l'impact éclair */
      .badge__photo-ring--impact::before {
        opacity: 1 !important;
        animation: halo-red-impact 0.35s ease-out forwards !important;
      }

      /* ── STRIES photo au hover — canvas-stries z=14 ──
   Pas de div supplémentaire : géré en CSS via un pseudo-element
   sur le wrapper .badge__photo-wrap                              */
      .badge__photo-wrap {
        position: absolute;
        border-radius: 50%;
        z-index: 10;
        overflow: hidden;
      }
      .badge--lg .badge__photo-wrap {
        width: 186px;
        height: 186px;
        top: 97px;
        left: 97px;
      }
      .badge--md .badge__photo-wrap {
        width: 126px;
        height: 126px;
        top: 67px;
        left: 67px;
      }
      .badge--sm .badge__photo-wrap {
        width: 68px;
        height: 68px;
        top: 36px;
        left: 36px;
      }

      /* Stries horizontales intenses — parasites visuels forts */
      .badge__photo-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(255, 255, 255, 0.22) 2px,
          rgba(255, 255, 255, 0.22) 3px,
          transparent 3px,
          transparent 5px,
          rgba(0, 0, 0, 0.3) 5px,
          rgba(0, 0, 0, 0.3) 6px,
          transparent 6px,
          transparent 9px,
          rgba(200, 255, 200, 0.08) 9px,
          rgba(200, 255, 200, 0.08) 10px
        );
        mix-blend-mode: overlay;
      }
      .badge:hover .badge__photo-wrap::after {
        animation: stries-flicker 0.12s steps(1) infinite;
      }
      @keyframes stries-flicker {
        0% {
          opacity: 1;
          transform: translateY(0);
          background-position: 0 0;
        }
        20% {
          opacity: 0.5;
          transform: translateY(2px);
        }
        35% {
          opacity: 0.9;
          transform: translateY(-3px);
        }
        50% {
          opacity: 0.7;
          transform: translateY(1px);
        }
        65% {
          opacity: 1;
          transform: translateY(-1px);
        }
        80% {
          opacity: 0.6;
          transform: translateY(3px);
        }
        100% {
          opacity: 0.9;
          transform: translateY(0);
        }
      }

      /* ── Anneau photo ── */
      .badge__photo-ring {
        position: absolute;
        border-radius: 50%;
        z-index: 12;
        pointer-events: none;
        border: 1px solid rgba(0, 255, 65, 0.18);
        animation: ring-breathe 4s ease-in-out infinite;
        transition:
          border-color 0.5s,
          box-shadow 0.5s;
      }
      .badge--lg .badge__photo-ring {
        width: 190px;
        height: 190px;
        top: 95px;
        left: 95px;
      }
      .badge--md .badge__photo-ring {
        width: 130px;
        height: 130px;
        top: 65px;
        left: 65px;
      }
      .badge--sm .badge__photo-ring {
        width: 70px;
        height: 70px;
        top: 35px;
        left: 35px;
      }
      @keyframes ring-breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.75;
        }
      }
      .badge:hover .badge__photo-ring {
        border-color: rgba(220, 30, 10, 0.65);
        box-shadow: 0 0 8px rgba(220, 30, 10, 0.4);
        animation: ring-pulse-red 0.7s ease-in-out infinite;
      }
      @keyframes ring-pulse-red {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 16px rgba(220, 30, 10, 0.65);
        }
      }

      /* ── Photo au hover : filtre rouge superposition — pas de flou ── */
      .badge:hover .badge__photo {
        filter: saturate(0.55) brightness(0.8) contrast(1.1);
        transition: filter 0.6s ease;
      }

      /* Overlay rouge "superposition/hard-light" sur la photo au hover
   Positionné dans .badge__photo-wrap (overflow:hidden = clip assuré) */
      .badge__photo-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 3; /* au-dessus de la photo, sous les scanlines */
        pointer-events: none;
        opacity: 0;
        background: rgba(180, 10, 0, 1);
        mix-blend-mode: hard-light; /* "superposition" CSS — sature le rouge, écrase le reste */
        transition: opacity 0.7s ease;
      }
      .badge:hover .badge__photo-wrap::before {
        opacity: 0.5; /* 50% comme demandé */
      }

      /* ── Canvas overlay DEVANT la photo (éclair) ── */
      .badge__canvas-over {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 15;
        display: block;
        pointer-events: none;
      }

      /* ── Tremblement photo — classes ajoutées via JS ── */

      /* Freeze TV : immobile → clignotement → sauts larges → clignotement rapide
   transform en steps(1,end) — discret et brutal comme un signal qui coupe
   filter en ease-in-out — la luminosité respire autour des glitchs          */
      @keyframes photo-freeze-transform {
        /* Freeze immobile */
        0%,
        22% {
          transform: translate(0, 0);
        }
        /* Saut horizontal gauche brusque */
        23% {
          transform: translate(-16px, 0);
        }
        24% {
          transform: translate(0, 0);
        }
        /* Saut droit + vertical */
        25% {
          transform: translate(18px, -8px);
        }
        26% {
          transform: translate(0, 0);
        }
        /* Freeze */
        27%,
        48% {
          transform: translate(0, 0);
        }
        /* Saut vertical net */
        49% {
          transform: translate(0, -14px);
        }
        50% {
          transform: translate(0, 10px);
        }
        51% {
          transform: translate(0, 0);
        }
        /* Freeze */
        52%,
        72% {
          transform: translate(0, 0);
        }
        /* Triple saut rapide */
        73% {
          transform: translate(-12px, 0);
        }
        74% {
          transform: translate(14px, 0);
        }
        75% {
          transform: translate(-8px, 6px);
        }
        76%,
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes photo-freeze-filter {
        0%,
        21% {
          filter: saturate(0.72) brightness(0.84);
        }
        22% {
          filter: saturate(0.72) brightness(1.2) contrast(1.3);
        }
        23% {
          filter: saturate(0.72) brightness(0.55);
        }
        24%,
        47% {
          filter: saturate(0.72) brightness(0.84);
        }
        48% {
          filter: saturate(0.72) brightness(1.1);
        }
        49%,
        50% {
          filter: saturate(0.8) brightness(1.05);
        }
        51%,
        71% {
          filter: saturate(0.72) brightness(0.84);
        }
        72% {
          filter: saturate(0.72) brightness(0.18);
        }
        73% {
          filter: saturate(0.72) brightness(0.84);
        }
        74% {
          filter: saturate(0.72) brightness(0.18);
        }
        75% {
          filter: saturate(0.72) brightness(1.15);
        }
        76%,
        100% {
          filter: saturate(0.72) brightness(0.84);
        }
      }
      .badge__photo--vibrate {
        animation:
          photo-freeze-transform 2.2s steps(1, end) infinite,
          photo-freeze-filter 2.2s ease-in-out infinite !important;
      }

      /* Glitch brutal — séquence rapide de décalages horizontaux nets */
      @keyframes photo-shake-transform {
        0%,
        4% {
          transform: translate(0, 0);
        }
        5% {
          transform: translate(-11px, 0);
        }
        6% {
          transform: translate(0, 0);
        }
        7% {
          transform: translate(13px, 0);
        }
        8%,
        19% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-14px, 0);
        }
        21% {
          transform: translate(0, -9px);
        }
        22% {
          transform: translate(10px, 0);
        }
        23%,
        36% {
          transform: translate(0, 0);
        }
        37%,
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes photo-shake-filter {
        0%,
        4% {
          filter: saturate(0.72) brightness(0.84);
        }
        5% {
          filter: saturate(0.72) brightness(0.84) blur(1.5px);
        }
        6% {
          filter: saturate(0.72) brightness(0.18);
        }
        7% {
          filter: saturate(1.3) brightness(1.5);
        }
        8%,
        19% {
          filter: saturate(0.72) brightness(0.84);
        }
        20% {
          filter: saturate(0.72) brightness(0.84) blur(2px);
        }
        21% {
          filter: saturate(0.72) brightness(0.18);
        }
        22% {
          filter: saturate(1.1) brightness(1.2);
        }
        23%,
        35% {
          filter: saturate(0.72) brightness(0.84);
        }
        36% {
          filter: saturate(0.72) brightness(0.14);
        }
        37%,
        100% {
          filter: saturate(0.72) brightness(0.84);
        }
      }
      .badge__photo--shake {
        animation:
          photo-shake-transform 0.55s steps(1, end) forwards,
          photo-shake-filter 0.55s ease-in-out forwards !important;
      }

      /* Flou fugace — signal momentanément brouillé */
      @keyframes photo-blur-filter {
        0% {
          filter: saturate(0.72) brightness(0.84);
        }
        15% {
          filter: saturate(0.72) brightness(0.84) blur(4.5px);
        }
        30% {
          filter: saturate(0.72) brightness(0.84) blur(0.5px);
        }
        45% {
          filter: saturate(0.72) brightness(0.84) blur(3px);
        }
        60%,
        100% {
          filter: saturate(0.72) brightness(0.84);
        }
      }
      .badge__photo--blur {
        animation: photo-blur-filter 0.65s ease-in-out forwards !important;
      }

      /* ── Badge verrouillé ──
   Pas de filter global qui écrase tout en gris.
   La photo reste visible mais désaturée/assombrie.
   Un voile bleu nuit profond (plus foncé que le body #142234)
   couvre le fond via un overlay dédié.                         */
      .badge--locked .badge__photo {
        filter: saturate(0) brightness(0.55) !important;
        transition: none;
      }
      .badge--locked .badge__canvas {
        /* Pluie quasi invisible — glyphs bleutés très atténués */
        opacity: 0.35;
      }
      /* Overlay bleu nuit profond — différent du fond body (#142234)
   On prend #0c1824 (plus sombre) pour le distinguer clairement  */
      .badge--locked .badge__vignette {
        background: radial-gradient(
          circle at 50% 50%,
          rgba(8, 16, 28, 0.45) 0%,
          rgba(8, 16, 28, 0.55) 42%,
          rgba(8, 16, 28, 0.72) 65%,
          rgba(8, 16, 28, 0.88) 80%,
          rgba(8, 16, 28, 1) 100%
        ) !important;
      }
      /* Icône 🔒 centrée au-dessus de la photo */
      .badge--locked .badge__lock-icon {
        position: absolute;
        z-index: 20;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(22px, 10%, 38px);
        pointer-events: none;
        filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.55));
        opacity: 0.85;
      }
      .badge--lg .badge__lock-icon {
        font-size: 38px;
      }
      .badge--md .badge__lock-icon {
        font-size: 28px;
      }
      .badge--sm .badge__lock-icon {
        font-size: 18px;
      }
      .badge--locked:hover .badge__lock-icon {
        opacity: 1;
      }

      /* ── Stries hover : quasi-illisible hors impact ── */
      .badge__photo-wrap::after {
        /* Réécrit ici pour plus d'opacité et densité */
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 1px,
          rgba(255, 255, 255, 0.28) 1px,
          rgba(255, 255, 255, 0.28) 2px,
          transparent 2px,
          transparent 4px,
          rgba(0, 0, 0, 0.38) 4px,
          rgba(0, 0, 0, 0.38) 5px,
          transparent 5px,
          transparent 7px,
          rgba(180, 0, 0, 0.12) 7px,
          rgba(180, 0, 0, 0.12) 8px
        ) !important;
      }
    </style>
  </head>
  <body>
    <!-- ════════ LARGE 380px ════════ -->
    <div class="slot">
      <div
        class="badge badge--lg"
        id="b-lg"
        role="img"
        aria-label="Badge Matrix — Sci-Fi"
      >
        <canvas
          class="badge__canvas"
          id="c-lg"
          width="380"
          height="380"
        ></canvas>
        <div class="badge__vignette" aria-hidden="true"></div>

        <div class="badge__photo-wrap" aria-hidden="false">
          <img
            class="badge__photo"
            src="https://i.postimg.cc/yxGtqK0X/lucid_origin_Prompt_Leonardo_AI_Avatar_Cin%C3%A9_D%C3%A9lices_inspir%C3%A9_Matrix_Create_a_cinematic_0.jpg"
            alt="Avatar Matrix"
            onerror="
              this.src =
                'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22186%22 height=%22186%22%3E%3Crect fill=%22%23142234%22 width=%22100%25%22 height=%22100%25%22/%3E%3Ctext x=%2250%25%22 y=%2252%25%22 fill=%22%2300ff41%22 font-size=%2280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3E💊%3C/text%3E%3C/svg%3E'
            "

            alt="Avatar Matrix verrouillé"
            onerror="
              this.src =
                'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22126%22 height=%22126%22%3E%3Crect fill=%22%230c1824%22 width=%22100%25%22 height=%22100%25%22/%3E%3C/svg%3E'

    <script>
      /* ══════════════════════════════════════════════════════════════
   MATRIX RAIN V9
   Normal  : pluie profondeur 2 plans (clair/sombre) + intermittence
             certaines colonnes du plan avant passent SUR la photo (canvas-over)
   Hover   : corruption rouge par vagues + parasites + flash blanc global
             éclair DEVANT photo + décalage des 2 moitiés photo
══════════════════════════════════════════════════════════════ */

      const GLYPHS =
        "ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ" +
        '0123456789:・."=*+-<>';
      const rg = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      const BG = [20, 34, 52]; // #142234

      class MatrixRain {
        constructor(canvasBack, canvasOver, photoEl, opts = {}) {
          this.cvB = canvasBack;
          this.cvO = canvasOver;
          this.ctxB = canvasBack.getContext("2d");
          this.ctxO = canvasOver ? canvasOver.getContext("2d") : null;
          this.photo = photoEl;
          this.photoRing = photoEl
            ? photoEl.closest(".badge")?.querySelector(".badge__photo-ring")
            : null;
          this.w = canvasBack.width;
          this.h = canvasBack.height;
          this.fs = opts.fontSize || 12;
          this.spd = opts.speed || 0.85;
          // Badge verrouillé : pluie ralentie, pas de hover, pas d'éclair, pas de shake
          this.locked = !!opts.locked;

          // ── Taille photo robuste ──
          // offsetWidth peut être 0 si l'image n'est pas encore rendue au 1er frame.
          // Fallback : 49% du diamètre du badge, cohérent avec les classes CSS.
          this._photoSize = () => {
            const ow = this.photo
              ? this.photo.offsetWidth || this.photo.naturalWidth
              : 0;
            return ow > 0 ? ow : Math.round(this.w * 0.49);
          };

          this.hovered = false;
          this.hoverT = 0;
          this.frame = 0;
          this.raf = null;

          // ── Corruption par vagues ──
          this.corruptWave = 0; // 0→1 intensité de la vague courante
          this.corruptDir = 1; // monte ou descend
          this.corruptTimer = 0;

          // ── Flash blanc global ──
          this.flashAlpha = 0;

          // ── Éclair ──
          this.bolt = null;
          this.boltLife = 0;
          this.boltTimer = 0;
          this.impacting = false; // true pendant le frame d'impact fort
          this.tearPath = null; // chemin de déchirure torn-paper

          // ── Tremblement photo au repos ──
          this.shakeTimer = 60 + Math.floor(Math.random() * 120);
          this.shaking = false;

          // ── Colonnes ──
          const nc = Math.floor(this.w / this.fs);
          this.drops = Array.from({ length: nc }, () => {
            // Plan : 0=arrière-plan (sombre, lent), 1=premier plan (vif, plus rapide)
            const plan = Math.random() < 0.35 ? 1 : 0;
            // Colonnes premier plan : ~20% passent sur le canvas-over (devant photo)
            const overPhoto = plan === 1 && Math.random() < 0.2;
            return {
              y: -Math.random() * this.h * 2.5,
              speed:
                plan === 1
                  ? (0.75 + Math.random() * 0.8) * this.fs
                  : (0.4 + Math.random() * 0.55) * this.fs,
              tailLen:
                plan === 1
                  ? 16 + Math.floor(Math.random() * 22)
                  : 10 + Math.floor(Math.random() * 16),
              chars: Array.from({ length: 55 }, rg),
              mutT: 0,
              mutRate:
                plan === 1
                  ? 3 + Math.floor(Math.random() * 5)
                  : 6 + Math.floor(Math.random() * 8),
              plan, // 0=bg 1=fg
              overPhoto, // dessine sur canvas-over si true
              active: false,
              sleepT: Math.floor(Math.random() * 220),
              activeT: 0,
              // Brillance propre à chaque colonne
              bright:
                plan === 1
                  ? 0.75 + Math.random() * 0.25
                  : 0.2 + Math.random() * 0.4,
            };
          });

          this._tick = this._tick.bind(this);

          // ── IntersectionObserver — pause RAF si badge hors écran ──
          // Économise ~3% CPU quand le badge est scrollé hors de la vue.
          this._visible = true;
          const obs = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                this._visible = e.isIntersecting;
                if (this._visible && !this.raf) {
                  this.raf = requestAnimationFrame(this._tick);
                }
              });
            },
            { threshold: 0 },
          );
          obs.observe(this.cvB);

          this.raf = requestAnimationFrame(this._tick);
        }

        setHover(v) {
          if (this.locked) return; // badge locked : pas d'interaction hover
          this.hovered = v;
          if (v) {
            // Premier éclair rapide — 40 frames (~0.67s à 60fps)
            this.boltTimer = 40;
            this.bolt = null;
          }
          if (!v && this.ctxO) this.ctxO.clearRect(0, 0, this.w, this.h);
        }

        _newBolt() {
          const w = this.w,
            h = this.h;
          const dir = Math.random() > 0.5 ? 1 : -1;
          const x0 = dir > 0 ? w * 0.06 : w * 0.94;
          const y0 = h * (0.04 + Math.random() * 0.2);
          const x1 = dir > 0 ? w * 0.94 : w * 0.06;
          const y1 = h * (0.72 + Math.random() * 0.22);
          const steps = 5 + Math.floor(Math.random() * 5);
          const pts = [{ x: x0, y: y0 }];
          for (let i = 1; i < steps; i++) {
            const t = i / steps;
            pts.push({
              x: x0 + (x1 - x0) * t + (Math.random() - 0.5) * w * 0.22,
              y: y0 + (y1 - y0) * t + (Math.random() - 0.5) * h * 0.09,
            });
          }
          pts.push({ x: x1, y: y1 });
          this.bolt = pts;
          this.boltLife = 0;
          this.impacting = false;

          // ── Génère le chemin de déchirure (torn paper) ──
          // Basé sur l'angle de l'éclair, traversant tout le badge de gauche à droite.
          // Dents irrégulières simulant un arrachage de papier.
          const angle = Math.atan2(y1 - y0, x1 - x0);
          const tearSteps = 28 + Math.floor(Math.random() * 14); // nb de dents
          const tearPts = [];
          const cx = w / 2,
            cy = h / 2;
          // Amplitude verticale des dents : forte irrégularité pour effet arraché
          const maxJag = 9 + Math.random() * 8;

          for (let i = 0; i <= tearSteps; i++) {
            const t = i / tearSteps;
            const bx = t * w; // de 0 à w
            // Position de base sur la ligne de l'éclair
            const baseY = cy + Math.tan(angle) * (bx - cx);
            // Dent : alternance haute/basse + amplitude aléatoire
            const jag =
              (Math.random() - 0.5) * 2 * maxJag +
              Math.sin(i * 2.3) * maxJag * 0.4 +
              Math.sin(i * 5.7 + 1.1) * maxJag * 0.25;
            tearPts.push({ x: bx, y: baseY + jag });
          }
          this.tearPath = tearPts;
        }

        /* Éclair sur canvas-over + effet coupure photo */
        _drawBolt(ht) {
          const ctx = this.ctxO;
          if (!ctx || ht < 0.1) return; // ctxO géré par le fondu de _tick

          // Décompte du timer de pause
          if (!this.bolt) {
            this.boltTimer--;
            if (this.boltTimer <= 0 && this.hovered) {
              this._newBolt();
              // Prochaine pause après cet éclair : 1.3s à 2.7s (80-160 frames)
              this.boltTimer = 80 + Math.floor(Math.random() * 80);
            }
            return;
          }

          this.boltLife++;

          // L'éclair dure 30-50 frames max puis disparaît
          if (this.boltLife > 45) {
            this.bolt = null;
            this.tearPath = null;
            return;
          }

          // Clignotement rapide sur sa courte durée
          const f1 = Math.sin(this.boltLife * 0.8);
          const f2 = Math.sin(this.boltLife * 1.9);
          const flicker = f1 * f2;
          const visible = flicker > -0.2;

          // Flash blanc au premier frame + explosion halo rouge
          if (this.boltLife === 1) {
            this.flashAlpha = 0.55;
            // Déclencher l'explosion du halo rouge via classe CSS
            if (this.photoRing) {
              this.photoRing.classList.remove("badge__photo-ring--impact");
              void this.photoRing.offsetWidth; // force reflow pour relancer l'animation
              this.photoRing.classList.add("badge__photo-ring--impact");
              setTimeout(() => {
                if (this.photoRing)
                  this.photoRing.classList.remove("badge__photo-ring--impact");
              }, 380);
            }
          }

          if (!visible) return;

          const pts = this.bolt;
          // Impact fort = boltLife < 10 (premiers frames de l'éclair)
          const isImpact = this.boltLife < 10;
          const intensity = ht * (0.6 + Math.abs(flicker) * 0.4);
          // Multiplicateur × 4 à l'impact, normal sinon
          const impactMult = isImpact ? 4.0 : 1.0;

          // ── PARASITES MASSIFS sur la photo pendant l'éclair ──
          // Dessinés sur le canvas-over (z=15) — strictement dans le cercle photo
          if (this.photo && this.photo.complete) {
            const pw = this._photoSize();
            const ph = pw; // photo carrée
            const cr = pw / 2;
            const cx2 = this.w / 2;
            const cy2 = this.h / 2;
            const px = cx2 - cr;
            const py = cy2 - cr;

            ctx.save();
            // Clip strict au cercle photo — les parasites ne débordent pas
            ctx.beginPath();
            ctx.arc(cx2, cy2, cr, 0, Math.PI * 2);
            ctx.clip();

            // Couche 1 : stries — confinées dans la photo
            const nbStries = Math.floor((20 + intensity * 40) * impactMult);
            for (let s = 0; s < nbStries; s++) {
              const sy = py + Math.random() * ph;
              const sw2 = pw * (0.3 + Math.random() * 0.8);
              const sx = px + Math.random() * pw * 0.4;
              const sa = Math.min(
                0.98,
                (0.28 + Math.random() * 0.6) * intensity * (isImpact ? 1.8 : 1),
              );
              ctx.fillStyle =
                Math.random() > 0.35
                  ? `rgba(255,255,255,${sa})`
                  : `rgba(230,15,0,${sa})`;
              ctx.fillRect(
                sx,
                sy,
                sw2,
                isImpact
                  ? 2 + Math.floor(Math.random() * 6)
                  : 1 + Math.floor(Math.random() * 4),
              );
            }

            // Couche 2 : blocs corrompus — confinés dans la photo
            const nbBlocs = Math.floor((10 + intensity * 18) * impactMult);
            for (let b = 0; b < nbBlocs; b++) {
              const bx = px + Math.random() * pw;
              const by = py + Math.random() * ph;
              const bw2 = isImpact
                ? 8 + Math.random() * 50
                : 4 + Math.random() * 30;
              const bh2 = isImpact
                ? 3 + Math.random() * 16
                : 2 + Math.random() * 8;
              const ba = Math.min(
                0.95,
                (0.32 + Math.random() * 0.55) *
                  intensity *
                  (isImpact ? 1.6 : 1),
              );
              ctx.fillStyle =
                Math.random() > 0.5
                  ? `rgba(0,255,65,${ba})`
                  : `rgba(210,0,0,${ba})`;
              ctx.fillRect(bx, by, bw2, bh2);
            }

            // Couche 3 : voile de corruption — photo quasi invisible à l'impact, revient après
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx2, cy2, cr, 0, Math.PI * 2);
            ctx.clip();
            // À l'impact (boltLife < 10) : voile opaque quasi total → photo disparaît
            // Hors impact : voile modéré, photo reste lisible
            const voileBase = isImpact ? 0.96 : 0.55;
            const voileA =
              intensity * voileBase * (isImpact ? 1 : Math.abs(flicker));
            if (voileA > 0.04) {
              // Fond noir qui efface la photo
              ctx.fillStyle = `rgba(0,0,0,${Math.min(0.92, voileA * 0.85)})`;
              ctx.fillRect(px, py, pw, ph);
              if (!isImpact) {
                // Hors impact : on redessine la photo par-dessus avec alpha réduit (photo visible mais perturbée)
                ctx.globalAlpha = Math.max(0, 1 - voileA);
                ctx.drawImage(
                  this.photo,
                  px + (Math.random() - 0.5) * 8,
                  py,
                  pw,
                  ph,
                );
                ctx.globalAlpha = 1;
              }
              // Teinte rouge/verte selon la corruption
              ctx.globalCompositeOperation = "screen";
              ctx.fillStyle = `rgba(${isImpact ? 180 : 120},${isImpact ? 0 : 30},0,${isImpact ? 0.6 : 0.35})`;
              ctx.beginPath();
              ctx.arc(cx2, cy2, cr, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalCompositeOperation = "source-over";
              ctx.globalAlpha = 1;
            }
            ctx.restore();

            ctx.restore();
          }

          // ── Calcul de l'angle de l'éclair pour la coupure ──
          const angle = Math.atan2(
            pts[pts.length - 1].y - pts[0].y,
            pts[pts.length - 1].x - pts[0].x,
          );
          const cx = this.w / 2,
            cy = this.h / 2;

          ctx.save();

          // ── DÉCOUPE TORN PAPER ──
          // Chemin de déchirure irrégulier généré une seule fois à la création de l'éclair
          // et réutilisé pour toute sa durée de vie.
          // Visible uniquement pendant l'impact (boltLife < 8) ou les flashs (flicker fort)
          if (
            this.photo &&
            this.photo.complete &&
            this.tearPath &&
            (this.boltLife < 10 || Math.abs(flicker) > 0.45)
          ) {
            const shift = 8 + Math.floor(intensity * 12); // décalage horizontal 8–20px
            const pw = this._photoSize();
            const ph = pw;
            const ppx = (this.w - pw) / 2;
            const ppy = (this.h - ph) / 2;
            const cr = pw / 2;
            const tear = this.tearPath; // tableau de {x, y} du bord déchiré

            // Clip global au cercle photo — rien ne déborde
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, cr, 0, Math.PI * 2);
            ctx.clip();

            // 1. Fond bleu nuit — visible dans la fente déchirée
            ctx.fillStyle = `rgb(${BG[0]},${BG[1]},${BG[2]})`;
            ctx.fill();

            // 2. Moitié HAUTE — clipée au-dessus du chemin déchiré, décalée à gauche
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(-10, -10);
            ctx.lineTo(this.w + 10, -10);
            // Descend jusqu'au premier point du bord déchiré
            ctx.lineTo(tear[tear.length - 1].x, tear[tear.length - 1].y);
            // Remonte en suivant le bord déchiré de droite à gauche
            for (let i = tear.length - 2; i >= 0; i--)
              ctx.lineTo(tear[i].x, tear[i].y);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(this.photo, ppx - shift, ppy, pw, ph);
            ctx.restore();

            // 3. Moitié BASSE — clipée en dessous du chemin déchiré, décalée à droite
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(tear[0].x, tear[0].y);
            for (let i = 1; i < tear.length; i++)
              ctx.lineTo(tear[i].x, tear[i].y);
            ctx.lineTo(this.w + 10, this.h + 10);
            ctx.lineTo(-10, this.h + 10);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(this.photo, ppx + shift, ppy, pw, ph);
            ctx.restore();

            // 4. Lueur verte/rouge sur le bord déchiré — reflet de l'éclair
            ctx.save();
            ctx.globalAlpha = intensity * 0.55;
            ctx.strokeStyle =
              this.corruptWave > 0.4
                ? `rgba(220,30,0,0.9)`
                : `rgba(0,220,60,0.8)`;
            ctx.lineWidth = 1.2;
            ctx.shadowBlur = 6;
            ctx.shadowColor = this.corruptWave > 0.4 ? "#ff2200" : "#00ff41";
            ctx.beginPath();
            ctx.moveTo(tear[0].x, tear[0].y);
            for (let i = 1; i < tear.length; i++)
              ctx.lineTo(tear[i].x, tear[i].y);
            ctx.stroke();
            ctx.restore();

            ctx.restore();
          }

          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          // ── HALO orange/rouge large ──
          ctx.globalAlpha = intensity * 0.4;
          ctx.strokeStyle = "#ff3300";
          ctx.lineWidth = 14;
          ctx.shadowBlur = 32;
          ctx.shadowColor = "#cc1100";
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();

          // ── Cœur blanc vif ──
          ctx.globalAlpha = intensity * 0.95;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#ffdd66";
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();

          // ── Ligne de coupure lumineuse ──
          ctx.globalAlpha = intensity * 0.18;
          ctx.fillStyle = "#ffee88";
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          ctx.fillRect(-this.w, -3, this.w * 2, 6);
          ctx.restore();

          ctx.restore();
        }

        /* Parasites — centrés sur la photo, débordent légèrement autour */
        _drawNoise(ht) {
          if (ht < 0.05) return;
          if (!this.photo || !this.photo.complete) return;

          const ctx = this.ctxB;
          const { w, h } = this;

          const pw = this._photoSize();
          const ph = pw; // photo carrée
          const px = (w - pw) / 2;
          const py = (h - ph) / 2;
          const cr = pw / 2; // rayon photo
          const cx = w / 2;
          const cy = h / 2;

          // Intensité liée à la présence de l'éclair
          // Sans éclair → parasites légers (15-25% lisible)
          // Avec éclair  → parasites massifs (géré dans _drawBolt)
          const hasBolt = !!this.bolt;
          const paraLevel = hasBolt ? 0 : ht * 0.45; // hors éclair : niveau modéré

          if (paraLevel < 0.02) return;

          ctx.save();

          // ── Clip strict au cercle de la photo — pas de débordement ──
          // Les parasites restent confinés à la zone photo visible.
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.clip();

          // Couche 1 : stries horizontales — dans la photo uniquement
          const ns = Math.floor(paraLevel * 60 * (0.4 + Math.random() * 0.6));
          for (let s = 0; s < ns; s++) {
            const sy = py + Math.random() * ph;
            const sw2 = pw * (0.3 + Math.random() * 0.8);
            const sx = px + Math.random() * pw * 0.4;
            const sa = (0.2 + Math.random() * 0.5) * paraLevel;
            ctx.fillStyle =
              Math.random() > 0.38
                ? `rgba(255,255,255,${sa})`
                : `rgba(210,15,0,${sa})`;
            ctx.fillRect(sx, sy, sw2, 1 + Math.floor(Math.random() * 4));
          }

          // Couche 2 : blocs corrompus — dans la photo uniquement
          const nb = Math.floor(paraLevel * 18 * (0.3 + Math.random() * 0.7));
          for (let b = 0; b < nb; b++) {
            const bx = px + Math.random() * pw;
            const by = py + Math.random() * ph;
            const bw2 = 3 + Math.random() * 24;
            const bh2 = 2 + Math.random() * 7;
            const ba = (0.18 + Math.random() * 0.42) * paraLevel;
            ctx.fillStyle =
              Math.random() > 0.5
                ? `rgba(0,200,50,${ba})`
                : `rgba(190,0,0,${ba})`;
            ctx.fillRect(bx, by, bw2, bh2);
          }

          // Couche 3 : voile sombre modéré sur la photo (pas le fond)
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.clip();
          ctx.fillStyle = `rgba(0,0,0,${paraLevel * 0.35})`;
          ctx.fillRect(px, py, pw, ph);
          ctx.globalCompositeOperation = "multiply";
          ctx.fillStyle = `rgba(160,10,0,${paraLevel * 0.3})`;
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = "source-over";
          ctx.restore();

          ctx.restore();
        }

        /* Flash — uniquement sur la zone photo, très bref */
        _drawFlash() {
          if (this.flashAlpha <= 0) return;
          const ctx = this.ctxO; // sur canvas-over z:15, pas sur ctxB
          if (!ctx) {
            this.flashAlpha = 0;
            return;
          }
          const pw = this._photoSize();
          const cx = this.w / 2,
            cy = this.h / 2,
            cr = pw / 2;
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.clip();
          ctx.globalAlpha = this.flashAlpha * 0.6; // atténué — pas de gros halo blanc
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(cx - cr, cy - cr, pw, pw);
          ctx.restore();
          this.flashAlpha = Math.max(0, this.flashAlpha - 0.12); // décroît vite
        }

        /* Tremblement photo */
        _updateShake() {
          if (!this.photo) return;

          // Vibration douce continue — active au repos uniquement
          if (
            !this.hovered &&
            !this.photo.classList.contains("badge__photo--vibrate") &&
            !this.photo.classList.contains("badge__photo--shake")
          ) {
            this.photo.classList.add("badge__photo--vibrate");
          }
          if (this.hovered) {
            this.photo.classList.remove("badge__photo--vibrate");
            this.photo.classList.remove("badge__photo--shake");
            this.photo.classList.remove("badge__photo--blur");
            return;
          }
          if (this.shaking) return;

          this.shakeTimer--;
          if (this.shakeTimer <= 0) {
            this.shaking = true;
            // Choix aléatoire : glitch brutal OU juste flou
            const type = Math.random() < 0.55 ? "shake" : "blur";
            this.photo.classList.remove("badge__photo--vibrate");
            this.photo.classList.add(`badge__photo--${type}`);
            const dur = type === "shake" ? 500 : 600;
            setTimeout(() => {
              if (this.photo) {
                this.photo.classList.remove(`badge__photo--${type}`);
                // Reprend la vibration douce après le glitch
                this.photo.classList.add("badge__photo--vibrate");
              }
              this.shaking = false;
              // Intervalle réduit : 1s à 3s (60-180 frames)
              this.shakeTimer = 60 + Math.floor(Math.random() * 120);
            }, dur);
          }
        }

        /* Dessin d'une colonne sur un contexte donné */
        _drawColumn(ctx, d, col, ht, corruptWave) {
          const { fs, h } = this;
          const x = col * fs + fs / 2;
          const headRow = Math.floor(d.y / fs);

          for (let j = 0; j < d.tailLen; j++) {
            const row = headRow - j;
            if (row < 0 || row * fs > h) continue;
            const py = row * fs;
            const glyph = d.chars[row % d.chars.length];
            const ratio = 1 - j / d.tailLen; // 1=tête

            // Niveau de corruption de cette colonne
            // Vague : corruption arrive de façon sinusoïdale
            const colCorrupt = ht * corruptWave * (0.6 + d.bright * 0.4);

            if (j === 0) {
              // Tête — toujours lumineuse sur ctxO (premier plan)
              const rh = Math.round(210 + colCorrupt * 45);
              const gh = Math.round(255 * (1 - colCorrupt * 0.82));
              const bh = Math.round(190 * (1 - colCorrupt * 0.95));
              ctx.fillStyle = `rgba(${rh},${gh},${bh},0.95)`;
              // Sur ctxO : shadowBlur toujours actif (premier plan visible)
              // Sur ctxB : shadowBlur uniquement au repos
              const isOver = ctx === this.ctxO;
              ctx.shadowBlur = isOver
                ? 14
                : ht < 0.05
                  ? d.plan === 1
                    ? 10
                    : 5
                  : 0;
              ctx.shadowColor = colCorrupt > 0.4 ? "#ff2200" : "#00ff41";
            } else {
              // Corps — plan avant plus brillant, encore plus opaque sur ctxO
              const isOver = ctx === this.ctxO;
              const base =
                d.plan === 1
                  ? Math.round(65 + ratio * 190 * d.bright)
                  : Math.round(25 + ratio * 110 * d.bright);
              const rH = Math.round(ratio * 200 * colCorrupt);
              const gH = Math.round(base * (1 - colCorrupt * 0.9));
              const bH = Math.round(base * 0.18 * (1 - colCorrupt));
              const a =
                ratio *
                (isOver
                  ? d.plan === 1
                    ? 0.92
                    : 0.6 // ctxO : plus opaque
                  : d.plan === 1
                    ? 0.75
                    : 0.4); // ctxB : normal
              ctx.fillStyle = `rgba(${rH},${gH},${bH},${a})`;
              ctx.shadowBlur = 0;
            }
            ctx.fillText(glyph, x, py);
          }
          ctx.shadowBlur = 0;
        }

        _tick() {
          // Pause si hors écran
          if (!this._visible) {
            this.raf = null;
            return;
          }
          const { ctxB: ctx, ctxO, w, h, fs } = this;
          this.frame++;

          // Transition hover
          this.hoverT += ((this.hovered ? 1 : 0) - this.hoverT) * 0.055;
          const ht = this.hoverT;

          // ── Vague de corruption ──
          // Oscille entre 0 et 1 de façon irrégulière via somme de sinus
          // Au hover complet (ht=1) : base à 0.55 pour que le rouge soit toujours présent
          if (ht > 0.05) {
            const base = 0.55 * ht; // plus ht est fort, plus la base rouge est haute
            this.corruptWave =
              base +
              0.35 * Math.sin(this.frame * 0.04) +
              0.2 * Math.sin(this.frame * 0.09 + 1.2) +
              0.12 * Math.sin(this.frame * 0.15 + 2.5);
            this.corruptWave = Math.max(0, Math.min(1, this.corruptWave));
          } else {
            this.corruptWave = 0;
          }

          // Fond bleu nuit sur ctxB — trail des colonnes arrière-plan
          ctx.fillStyle = `rgba(${BG[0]},${BG[1]},${BG[2]},0.13)`;
          ctx.fillRect(0, 0, w, h);

          // Fondu sur ctxO via destination-out — efface progressivement sans peindre de couleur
          // destination-out réduit l'alpha des pixels existants → les colonnes s'estompent naturellement
          // sans jamais créer un voile opaque devant la photo
          if (ctxO) {
            ctxO.save();
            ctxO.globalCompositeOperation = "destination-out";
            ctxO.fillStyle = "rgba(0,0,0,0.18)";
            ctxO.fillRect(0, 0, w, h);
            ctxO.restore();
          }

          ctx.font = `bold ${fs}px "Courier New", monospace`;
          ctx.textAlign = "center";

          // ── Pluie arrière-plan sur canvas back ──
          // ── Pluie premier plan over-photo sur canvas-over ──
          for (let i = 0; i < this.drops.length; i++) {
            const d = this.drops[i];

            if (!d.active) {
              d.sleepT--;
              if (d.sleepT <= 0) {
                d.active = true;
                d.activeT = 80 + Math.floor(Math.random() * 200);
                d.y = -(d.tailLen * fs) - Math.random() * h * 0.3;
                d.speed =
                  d.plan === 1
                    ? (0.75 + Math.random() * 0.8) * fs
                    : (0.4 + Math.random() * 0.55) * fs;
                d.tailLen =
                  d.plan === 1
                    ? 16 + Math.floor(Math.random() * 22)
                    : 10 + Math.floor(Math.random() * 16);
              }
              continue;
            }
            d.activeT--;
            if (d.activeT <= 0) {
              d.active = false;
              d.sleepT =
                d.plan === 1
                  ? 50 + Math.floor(Math.random() * 150)
                  : 80 + Math.floor(Math.random() * 200);
              continue;
            }

            d.mutT++;
            if (d.mutT >= d.mutRate) {
              d.mutT = 0;
              d.chars[Math.floor(Math.random() * d.chars.length)] = rg();
            }

            // Choisir le bon canvas
            // Au repos (ht < 0.15) : colonnes overPhoto passent sur ctxO (z:15) devant la photo — vert
            // Au hover  (ht >= 0.15) : colonnes overPhoto passent aussi sur ctxO — mais en rouge (corruptWave élevé)
            // → dans les 2 cas, ~20% des colonnes plan avant passent DEVANT la photo pour la profondeur
            const drawCtx = d.overPhoto && ctxO ? ctxO : ctx;

            if (drawCtx === ctxO) {
              // Premier plan devant photo : glyphes ~35% plus grands + shadow renforcé
              const fsFG = Math.round(this.fs * 1.35);
              drawCtx.font = `bold ${fsFG}px "Courier New", monospace`;
              drawCtx.textAlign = "center";
            }

            this._drawColumn(drawCtx, d, i, ht, this.corruptWave);

            d.y += d.speed * 0.85;
            if (d.y - d.tailLen * fs > h) {
              d.active = false;
              d.sleepT = 30 + Math.floor(Math.random() * 100);
            }
          }

          this._drawNoise(ht);
          this._drawFlash();
          if (!this.locked) this._drawBolt(ht);
          if (!this.locked) this._updateShake();

          this.raf = requestAnimationFrame(this._tick);
        }

        destroy() {
          if (this.raf) cancelAnimationFrame(this.raf);
        }
      }

      /* ── Init ── */
      [
        { cid: "c-lg", oid: "co-lg", bid: "b-lg", fontSize: 13, speed: 0.9 },
        { cid: "c-md", oid: "co-md", bid: "b-md", fontSize: 10, speed: 0.8 },
        { cid: "c-sm", oid: "co-sm", bid: "b-sm", fontSize: 6, speed: 0.7 },
        // Badge locked : RAF lent, pas de hover, pas d'éclair, pas de photo
        {
          cid: "c-lk",
          oid: null,
          bid: null,
          fontSize: 10,
          speed: 0.3,
          locked: true,
        },
      ].forEach(({ cid, oid, bid, fontSize, speed, locked }) => {
        const cv = document.getElementById(cid);
        const cvo = oid ? document.getElementById(oid) : null;
        if (!cv) return;
        const badgeEl = bid ? document.getElementById(bid) : null;
        const photoEl = badgeEl
          ? badgeEl.querySelector(
              ".badge__photo-wrap .badge__photo, .badge__photo",
            )
          : null;
        const rain = new MatrixRain(cv, cvo, photoEl, {
          fontSize,
          speed,
          locked,
        });
        if (badgeEl) {
          badgeEl.addEventListener("mouseenter", () => rain.setHover(true));
          badgeEl.addEventListener("mouseleave", () => rain.setHover(false));
        }
      });
    </script>
  </body>
</html>
