<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sherlock Frame 4 — v3</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh; background:#0a0806;
  display:flex; justify-content:center; align-items:center; padding:40px;
  font-family:'Courier New',monospace;
}
.badge-wrap{
  width:720px; height:720px;
  position:relative; overflow:visible;
  cursor:none; flex-shrink:0;
  user-select:none;
}
/* Zone clippée pour contenir le cadre + photo */
.badge-clip{
  position:absolute; top:0; left:0;
  width:720px; height:720px;
  overflow:hidden; pointer-events:none;
}
.badge-inner{
  width:1440px; height:1440px;
  transform:scale(0.5); transform-origin:top left;
  position:relative;
}
.b-photo{
  position:absolute;
  left:317px; top:270px;
  width:800px; height:800px;
  border-radius:50%;
  object-fit:cover; object-position:center top;
  z-index:10; pointer-events:none;
}
.b-frame{
  position:absolute; top:0; left:0;
  width:1440px; height:1440px;
  z-index:20; pointer-events:none;
}
.b-canvas-fx{
  position:absolute; top:0; left:0;
  width:1440px; height:1440px;
  z-index:30; pointer-events:none;
}
.b-canvas-loupe{
  position:absolute; top:0; left:0;
  width:1440px; height:1440px;
  z-index:40; pointer-events:none;
}
.b-canvas-thoughts{
  position:absolute; top:0; left:0;
  width:1440px; height:1440px;
  transform:scale(0.5); transform-origin:top left;
  z-index:100; pointer-events:none;
}
/* ── Curseur — masqué, remplacé par le réticule canvas ── */
.badge-wrap{ cursor:none; }
body{ cursor:default; }
/* ── Vignette de chargement ── */
#vignette-load{
  position:fixed; inset:0; background:#0a0806;
  z-index:9998; pointer-events:none;
  transition:opacity .6s ease .2s;
}
#vignette-load.done{ opacity:0; }
/* ── Notification de découverte — style victorien ── */
#discovery-notif{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%) scale(.88) translateY(-8px);
  background:rgba(8,5,2,.90);
  border:1px solid rgba(168,132,42,.60);
  border-top:2px solid rgba(215,178,55,.75);
  border-bottom:2px solid rgba(215,178,55,.75);
  border-radius:2px;
  padding:10px 22px 9px;
  pointer-events:none;
  z-index:200;
  opacity:0;
  transition:transform .25s cubic-bezier(.22,.68,0,1.2), opacity .22s ease;
  white-space:nowrap;
  /* Gravure interne */
  box-shadow:
    inset 0 1px 0 rgba(215,178,55,.12),
    inset 0 -1px 0 rgba(215,178,55,.12),
    0 4px 24px rgba(0,0,0,.55),
    0 0 32px rgba(175,138,35,.08);
}
#discovery-notif.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1) translateY(0);
}
/* Ligne décorative haut et bas */
#discovery-notif::before,
#discovery-notif::after{
  content:'';
  display:block;
  height:1px;
  background:linear-gradient(90deg,
    transparent 0%, rgba(215,178,55,.0) 5%,
    rgba(215,178,55,.35) 30%, rgba(215,178,55,.55) 50%,
    rgba(215,178,55,.35) 70%, rgba(215,178,55,.0) 95%,
    transparent 100%);
  margin: 3px -22px;
}
#discovery-notif .notif-label{
  display:block;
  font:400 8px/1 'Courier New',monospace;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(175,138,35,.62);
  text-align:center;
  margin-bottom:5px;
}
#discovery-notif .notif-text{
  display:block;
  font:italic 700 13px/1 'Georgia','Times New Roman',serif;
  letter-spacing:.06em;
  color:rgba(232,205,138,.92);
  text-align:center;
  text-shadow:0 0 12px rgba(215,178,55,.28);
}
#discovery-notif .notif-ref{
  display:block;
  font:400 8px/1 'Courier New',monospace;
  letter-spacing:.22em;
  color:rgba(145,112,28,.50);
  text-align:center;
  margin-top:5px;
}
.state-label{
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  color:rgba(196,160,82,.38); font-size:10px;
  letter-spacing:.18em; text-transform:uppercase; pointer-events:none;
}
</style>
</head>
<body>

<div class="badge-wrap" id="badgeWrap">

  <div class="badge-clip" id="badgeClip">
    <div class="badge-inner" id="badgeInner">

      <!-- Photo de profil -->
      <img class="b-photo" id="profileImg"
           src="https://i.postimg.cc/157b6b22/portrait_sherlock.png" alt=""/>

      <!-- Cadre -->
      <img class="b-frame" id="frameImg"
           src="https://i.postimg.cc/bwrr64zx/frame-sherlock-4.png" alt=""/>

      <!-- Canvas FX : flamme + métal -->
      <canvas class="b-canvas-fx" id="cvFX" width="1440" height="1440"></canvas>

      <!-- Canvas loupe : verre code + assets révélés dedans -->
      <canvas class="b-canvas-loupe" id="cvLoupe" width="1440" height="1440"></canvas>

    </div>
  </div>

  <!-- Canvas pensées : au-dessus de tout, hors clip -->
  <canvas class="b-canvas-thoughts" id="cvThoughts" width="1440" height="1440"></canvas>

  <div id="discovery-notif">
    <span class="notif-label">Dossier n° 221B</span>
    <span class="notif-text">Indice révélé</span>
    <span class="notif-ref">— S. Holmes, Esq.</span>
  </div>

</div>

<div class="state-label" id="stateLabel">Observation…</div>

<!-- Vignette chargement -->
<div id="vignette-load"></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONSTANTES
══════════════════════════════════════════════════════════ */

/* Guard utilitaire — évite les NaN/Infinity dans les gradients */
function safeR(v,min=0.5){ const n=+v; return (isFinite(n)&&n>0) ? Math.max(min,n) : min; }
function safeN(v,fb=0)   { const n=+v; return isFinite(n) ? n : fb; }
function safeDen(n,d,fb=1){ return (isFinite(d)&&Math.abs(d)>1e-9) ? n/d : fb; }

const NATIVE    = 1440;
const INV_SCALE = 2;
/* Limites pour éviter l'accumulation de particules */
const MAX_PARTICLES = 120;
const MAX_THOUGHTS  = 2;

/* ── Variante jour/nuit — calculé immédiatement au chargement ── */
const HOUR=(()=>new Date().getHours())();
const IS_NIGHT=(HOUR>=21||HOUR<7);
const IS_EVENING=(HOUR>=18&&HOUR<21);
const TIME_MOD={
  flameIntens : IS_NIGHT?1.35:IS_EVENING?1.15:0.85,
  thoughtFreq : IS_NIGHT?0.65:IS_EVENING?0.82:1.0,
  metalFreq   : IS_NIGHT?0.018:IS_EVENING?0.012:0.007,
  ringGlow    : IS_NIGHT?1.55:IS_EVENING?1.25:0.80,
  bgTint      : IS_NIGHT?'rgba(8,4,14,.28)':IS_EVENING?'rgba(18,8,2,.18)':null,
};

/* Loupe codée */
const LOUPE = {
  r        : 90,    // rayon du verre en pixels natifs
  magFactor: 2.2,   // grossissement
  rimW     : 3.5,   // épaisseur contour laiton
};

/* Config cadre */
const CFG = {
  flame  : {x:196, y:673.8},           // pin effet_4 bas = base flamme
  flameTop : 565.8,                     // pin effet_4 haut = sommet flamme
  particleTop: 305.5,                   // pin effet_5 haut = sommet particules
  particleBase: 593.5,                  // pin effet_5 bas = base particules
  ring   : {cx:718, cy:670, r:400},
  thoughtCX: 718, thoughtCY: 670,
  /* Pins métal */
  metalPts:[
    {x:715.3, y:128.2},
    {x:1197.1,y:474.4},
    {x:227.9, y:792.8},
  ],
  /* Assets PNG révélés uniquement dans la loupe */
  revealAssets:[
    {id:'ra-1',url:'https://i.postimg.cc/wyZVHptc/empreinte-mirror-sherlock-3.png',
     x:426.5,y:443.1,w:145,h:168,blend:'multiply'},
    {id:'ra-2',url:'https://i.postimg.cc/9RKpVh4Y/letters-sherlock-3.png',
     x:581.5,y:1158.5,w:144,h:151,blend:'overlay'},
    {id:'ra-3',url:'https://i.postimg.cc/hz6rgBJ8/message-sherlock-3.png',
     x:931,y:1200.2,w:143,h:71,blend:'multiply'},
    {id:'ra-4',url:'https://i.postimg.cc/ZB2cZS98/empreinte-sherlock-3.png',
     x:657.1,y:1086.4,w:38,h:60,blend:'multiply'},
  ],
  /* Indices procéduraux dans le ring — visibles UNIQUEMENT dans la loupe */
  hiddenClues:[
    /* Sur le cadre supérieur */
    {type:'text',  text:'C_NÉ',  x:598, y:338, fs:14, rot:-.08, alpha:.72},
    {type:'text',  text:'D_L_C_S', x:720, y:328, fs:12, rot:.04, alpha:.65},
    /* Empreinte de pouce dessinée */
    {type:'fingerprint', x:860, y:390, r:22, alpha:.55},
    /* Chiffre caché */
    {type:'text',  text:'1895',  x:480, y:420, fs:11, rot:-.12, alpha:.60},
    /* Annotation manuscrite */
    {type:'text',  text:'→ Baker St.', x:920, y:520, fs:10, rot:.06, alpha:.58},
    /* Initiales */
    {type:'text',  text:'S.H.',  x:550, y:520, fs:16, rot:-.05, alpha:.70},
    /* Croix d'index */
    {type:'cross', x:670, y:460, size:12, alpha:.50},
    {type:'cross', x:810, y:430, size:9,  alpha:.45},
    /* Lettre isolée */
    {type:'text',  text:'?',     x:760, y:395, fs:18, rot:.10, alpha:.62},
    /* Numéro de dossier */
    {type:'text',  text:'#217',  x:650, y:370, fs:10, rot:.08, alpha:.55},
  ],
};

/* ══════════════════════════════════════════════════════════
   PENSÉES
══════════════════════════════════════════════════════════ */
const THOUGHTS = {
  1:["Hmm… interesting…","There's something hidden here…","Observe carefully…","The details matter…"],
  2:["Look closer…","These notes are not random…","There is a pattern…","Each detail connects…"],
  3:["Ah… now we see it.","Hidden in plain sight.","The truth reveals itself…","Remarkable."],
  4:["Everything connects…","The pieces are aligning…","We're getting closer…"],
  5:["Ciné Délices."],
};
const STATE_LABELS={1:'Observation…',2:'Exploration…',3:'Découverte…',4:'Déduction…',5:'Révélation'};

/* ══════════════════════════════════════════════════════════
   DOM
══════════════════════════════════════════════════════════ */
const wrap       = document.getElementById('badgeWrap');
const profileImg = document.getElementById('profileImg');
const frameImg   = document.getElementById('frameImg');
const cvFX       = document.getElementById('cvFX');
const cvLoupe    = document.getElementById('cvLoupe');
const cvTh       = document.getElementById('cvThoughts');
const ctxFX      = cvFX.getContext('2d');
const ctxL       = cvLoupe.getContext('2d');
const ctxTh      = cvTh.getContext('2d');
const stLabel    = document.getElementById('stateLabel');
const cursorEl   = null; // curseur rendu dans le canvas loupe
const vignetteEl = document.getElementById('vignette-load');
const notifEl    = document.getElementById('discovery-notif');
let   notifTimer = null;

/* Labels victoriens par asset */
const DISCOVERY_LABELS={
  'ra-1':['Empreinte digitale','Appartient à un suspect connu.'],
  'ra-2':['Lettres chiffrées','Un message dissimulé dans les notes.'],
  'ra-3':['Missive secrète','Rédigée sous fausse identité.'],
  'ra-4':['Trace relevée','Indice physique confirmé.'],
};

function showDiscovery(assetId){
  const [title,sub]=DISCOVERY_LABELS[assetId]||['Indice révélé','Élément d\'enquête identifié.'];
  notifEl.querySelector('.notif-text').textContent=title;
  notifEl.querySelector('.notif-ref').textContent='— '+sub;
  notifEl.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>notifEl.classList.remove('show'), 2400);
}

/* ── Vignette de chargement ── */
window.addEventListener('load',()=>{
  vignetteEl.classList.add('done');
  setTimeout(()=>vignetteEl.remove(),900);
});

/* ── Visibility throttle — pause quand l'onglet est caché ── */
let paused=false;
document.addEventListener('visibilitychange',()=>{
  paused=document.hidden;
  if(!paused) requestAnimationFrame(tick); // reprend
});

/* Préchargement des assets reveal */
const revealImgs = {};
CFG.revealAssets.forEach(a=>{
  const img=new Image(); img.crossOrigin='anonymous';
  img.src=a.url; revealImgs[a.id]=img;
});

/* ══════════════════════════════════════════════════════════
   ÉTAT
══════════════════════════════════════════════════════════ */
let hovered       = false;
let mouseX        = CFG.thoughtCX;
let mouseY        = CFG.thoughtCY;
let sherlockState = 1;
let particles     = [];
let thoughts      = [];
let frameN        = 0;
let phase         = 0;

/* Flamme */
let flickerPhase=Math.random()*Math.PI*2;
let flickerVal  =1.0;

/* Métal — phases individuelles */
const metalPhases=CFG.metalPts.map(()=>Math.random()*Math.PI*2);
const metalSpeeds=CFG.metalPts.map(()=>.0048+Math.random()*.0040);
const metalGlide =CFG.metalPts.map(()=>({
  x:0,y:0,
  vx:(Math.random()-.5)*.30,
  vy:(Math.random()-.5)*.24,
}));

/* Pensées */
let thTimer=0, thInterval=_nextThInt();
function _nextThInt(){ return Math.round(((sherlockState===1?220:80)+Math.floor(Math.random()*160))*TIME_MOD.thoughtFreq); }

/* ══════════════════════════════════════════════════════════
   EVENTS
══════════════════════════════════════════════════════════ */
wrap.addEventListener('mouseenter',()=>{ hovered=true; _setState(2); });
wrap.addEventListener('mouseleave',()=>{
  hovered=false;
  ctxL.clearRect(0,0,NATIVE,NATIVE);
  thoughts=thoughts.filter(p=>!p.hoverOnly);
  _setState(1);
});
wrap.addEventListener('mousemove',e=>{
  const r=wrap.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*INV_SCALE;
  mouseY=(e.clientY-r.top )*INV_SCALE;
  if(!hovered) return;

  /* Zones relatives au CFG — robustes si le layout change */
  const {cx,cy,r:rr}=CFG.ring;
  let contextState=2;
  /* Zone basse du cadre (notes) : arc inférieur du ring */
  const notesZone   = mouseY > cy+rr*.45 && mouseY < cy+rr+100;
  /* Zone lettres : bande inférieure très basse */
  const lettersZone = mouseY > cy+rr*.65 && mouseX > cx-rr*.4 && mouseX < cx+rr*.4;
  /* Zone empreinte : quart supérieur gauche du ring */
  const empreinteZone = mouseX < cx-rr*.08 && mouseX > cx-rr*.65
                     && mouseY < cy-rr*.05 && mouseY > cy-rr*.65;

  if(lettersZone)       contextState=3;
  else if(notesZone)    contextState=2;
  else if(empreinteZone)contextState=4;
  else                   contextState=2;

  _setState(contextState);
});

/* ── Touch support (mobile) ── */
wrap.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=wrap.getBoundingClientRect();
  mouseX=(t.clientX-rect.left)*INV_SCALE;
  mouseY=(t.clientY-rect.top )*INV_SCALE;
  hovered=true; _setState(2);
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];
  const rect=wrap.getBoundingClientRect();
  mouseX=(t.clientX-rect.left)*INV_SCALE;
  mouseY=(t.clientY-rect.top )*INV_SCALE;
},{passive:false});
wrap.addEventListener('touchend',()=>{
  hovered=false; ctxL.clearRect(0,0,NATIVE,NATIVE); _setState(1);
});

function _setState(n){
  if(sherlockState===n)return;
  sherlockState=n;
  stLabel.textContent=STATE_LABELS[n];
  thInterval=_nextThInt();
}

/* ── Flash de découverte — déclenché une seule fois par indice ── */
const discoveredAssets=new Set();
let ringHaloPhase=0;

/* ── Pensées rares (latin / victorien) ── */
const RARE_THOUGHTS=[
  [{w:'Alea iacta…',r:50},{w:'Alea iacta est.',r:85}],
  [{w:'Ex nihilo…',r:45},{w:'Ex nihilo nihil.',r:90}],
  [{w:'Élémentaire.',r:65}],
  [{w:'Mon cher Watson…',r:95}],
  [{w:'Sic itur…',r:40},{w:'Sic itur ad astra.',r:80}],
];

/* ── Halo Sherlock — pulsation ambrée autour de la photo ── */
function drawRingHalo(){
  ringHaloPhase+=.012+Math.sin(phase*.42)*.003;
  /* Triple oscillation organique */
  const pulse=.5+Math.sin(ringHaloPhase)*.28+Math.sin(ringHaloPhase*2.3+.8)*.12
             +Math.sin(ringHaloPhase*.55+1.6)*.08;
  const r=CFG.ring.r, cx=CFG.ring.cx, cy=CFG.ring.cy;
  const glowW=hovered?20:12;
  const ringMult=TIME_MOD.ringGlow;
  /* Anneau intérieur — bord de la photo */
  const g=ctxFX.createRadialGradient(cx,cy,r-glowW,cx,cy,r+8);
  g.addColorStop(0,'rgba(180,128,28,0)');
  g.addColorStop(.35,`rgba(188,138,32,${pulse*.042*(hovered?1.6:1)*ringMult})`);
  g.addColorStop(.65,`rgba(165,118,18,${pulse*.025*(hovered?1.6:1)*ringMult})`);
  g.addColorStop(1,'rgba(135,92,8,0)');
  ctxFX.beginPath(); ctxFX.arc(cx,cy,r+8,0,Math.PI*2); ctxFX.fillStyle=g; ctxFX.fill();
}

/* ══════════════════════════════════════════════════════════
   INDICES CACHÉS — procéduraux, visibles uniquement dans la loupe
══════════════════════════════════════════════════════════ */
function _drawHiddenClues(ctx, loupeCx, loupeCy, loupeR, mag){
  /* Seuls les indices dans la zone visible de la loupe sont dessinés.
     On est déjà dans l'espace zoomé (transform mag appliqué). */
  const visR2=(loupeR/mag+80)*(loupeR/mag+80); // dist² précalculé

  CFG.hiddenClues.forEach(c=>{
    const dx=c.x-loupeCx, dy=c.y-loupeCy;
    if(dx*dx+dy*dy > visR2) return; // comparaison carré — pas de sqrt

    ctx.save();
    ctx.translate(c.x, c.y);
    if(c.rot) ctx.rotate(c.rot);

    if(c.type==='text'){
      ctx.font=`italic bold ${c.fs}px 'Georgia','Times New Roman',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      /* Blanc à 70% d'opacité */
      ctx.fillStyle=`rgba(255,255,255,${c.alpha*.70})`;
      ctx.shadowColor=`rgba(255,255,255,${c.alpha*.25})`; ctx.shadowBlur=2;
      ctx.fillText(c.text,0,0);
    }

    else if(c.type==='fingerprint'){
      const ridges=10, sp=c.r/ridges;
      for(let ri=1;ri<=ridges;ri++){
        const rx=ri*sp, ry=rx*.68+Math.sin(ri*.7)*.4;
        const rFade=1-ri/ridges;
        const ra=c.alpha*.70*rFade*rFade;
        if(ra<.02) continue;
        const breaks=ri%3===0?1:0;
        ctx.strokeStyle=`rgba(255,255,255,${ra})`;
        ctx.lineWidth=.6;
        if(!breaks){
          ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,.3,Math.PI*2-.5); ctx.stroke();
        }
      }
      ctx.fillStyle=`rgba(255,255,255,${c.alpha*.70*.28})`;
      ctx.beginPath(); ctx.ellipse(0,0,sp*.7,sp*.5,0,0,Math.PI*2); ctx.fill();
    }

    else if(c.type==='cross'){
      ctx.strokeStyle=`rgba(255,255,255,${c.alpha*.70})`;
      ctx.lineWidth=.9; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-c.size,0); ctx.lineTo(c.size,0);
      ctx.moveTo(0,-c.size); ctx.lineTo(0,c.size);
      ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${c.alpha*.70*.55})`;
      ctx.lineWidth=.6;
      ctx.beginPath(); ctx.arc(0,0,c.size*.55,0,Math.PI*2); ctx.stroke();
    }

    ctx.restore();
  });
}

/* ══════════════════════════════════════════════════════════
   LOUPE — ENTIÈREMENT EN CODE
══════════════════════════════════════════════════════════ */
function drawLoupe(){
  ctxL.clearRect(0,0,NATIVE,NATIVE);
  if(!hovered) return;

  const lx=mouseX, ly=mouseY;
  const lr=LOUPE.r;
  const mag=LOUPE.magFactor;

  /* ── 1. Grossissement : redessine photo + cadre zoomés dans le cercle ── */
  ctxL.save();
  ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.clip();
  ctxL.translate(lx,ly); ctxL.scale(mag,mag); ctxL.translate(-lx,-ly);
  if(profileImg.complete && profileImg.naturalWidth){
    ctxL.save();
    ctxL.beginPath(); ctxL.arc(317+400,270+400,400,0,Math.PI*2); ctxL.clip();
    ctxL.drawImage(profileImg,317,270,800,800);
    ctxL.restore();
  }
  if(frameImg.complete && frameImg.naturalWidth){
    ctxL.drawImage(frameImg,0,0,NATIVE,NATIVE);
  }
  /* Assets révélés dans la loupe */
  let revealedCount=0;
  CFG.revealAssets.forEach(a=>{
    const img=revealImgs[a.id];
    if(!img||!img.complete||!img.naturalWidth||!img.naturalHeight) return;
    const aCx=a.x+a.w/2, aCy=a.y+a.h/2;
    const dx=aCx-lx, dy=aCy-ly;
    const threshold=lr/mag+Math.max(a.w,a.h)/2;
    if(dx*dx+dy*dy <= threshold*threshold){
      revealedCount++;
      if(!discoveredAssets.has(a.id)){
        discoveredAssets.add(a.id);
        persist.found=[...discoveredAssets]; _saveState(persist);
        showDiscovery(a.id);
        playRevealChime();
        /* S'estompe uniquement à la première découverte par session */
        _wearInk(a.id);
      }
      ctxL.save();
      ctxL.globalCompositeOperation = a.blend==='overlay' ? 'screen' : 'multiply';
      /* Opacité haute — encre légèrement fanée selon sessions passées (max 30%) */
      ctxL.globalAlpha=Math.max(0.70, 1.0 - Math.min(.30, inkFade[a.id]||0));
      ctxL.drawImage(img,a.x,a.y,a.w,a.h);
      ctxL.restore();
    }
  });

  /* Indices procéduraux cachés dans le ring */
  _drawHiddenClues(ctxL, lx, ly, lr, mag);

  ctxL.restore(); /* fin zoom + clip */

  if(revealedCount>=2) _setState(5);
  else if(revealedCount>=1) _setState(4);

  /* ── 2. Teinte verre + reflet spéculaire ── */
  ctxL.save();
  ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.clip();
  /* Pulse ambré si indice révélé */
  if(revealedCount>0){
    const lrS=safeR(lr);
    const pA=(.06+Math.sin(phase*4.8)*.04)*Math.min(1,revealedCount*.8);
    const gP=ctxL.createRadialGradient(lx,ly,lrS*.3,lx,ly,lrS);
    gP.addColorStop(0,`rgba(215,178,55,0)`);
    gP.addColorStop(.65,`rgba(215,178,55,${pA*.4})`);
    gP.addColorStop(1,`rgba(215,178,55,${pA})`);
    ctxL.fillStyle=gP; ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.fill();
  }
  /* Teinte verre ancien */
  const lrSafe=safeR(lr);
  const gV=ctxL.createRadialGradient(lx,ly,0,lx,ly,lrSafe);
  gV.addColorStop(0,`rgba(205,222,190,.06)`);
  gV.addColorStop(.7,`rgba(190,208,175,.03)`);
  gV.addColorStop(1,`rgba(155,170,132,.01)`);
  ctxL.fillStyle=gV; ctxL.beginPath(); ctxL.arc(lx,ly,lrSafe,0,Math.PI*2); ctxL.fill();
  /* Reflet spéculaire haut-gauche */
  const spA=.15+Math.sin(phase*2.2)*.08;
  const spR=safeR(lrSafe*.44);
  const gSp=ctxL.createRadialGradient(
    lx-lrSafe*.38,ly-lrSafe*.34,0,
    lx-lrSafe*.38,ly-lrSafe*.34,spR
  );
  gSp.addColorStop(0,`rgba(255,255,255,${spA})`);
  gSp.addColorStop(.38,`rgba(240,248,222,${spA*.28})`);
  gSp.addColorStop(1,`rgba(192,205,170,0)`);
  ctxL.fillStyle=gSp; ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.fill();
  /* Aberration chromatique bord */
  const abA=.018+Math.sin(phase*1.8)*.007;
  ctxL.strokeStyle=`rgba(195,88,68,${abA})`; ctxL.lineWidth=1.0;
  ctxL.beginPath(); ctxL.arc(lx+.7,ly-.3,lr*.88,0,Math.PI*2); ctxL.stroke();
  ctxL.strokeStyle=`rgba(48,108,195,${abA*.6})`; ctxL.lineWidth=.8;
  ctxL.beginPath(); ctxL.arc(lx-.5,ly+.3,lr*.86,0,Math.PI*2); ctxL.stroke();
  ctxL.restore();

  /* ── 3. Contour laiton ── */
  ctxL.save();
  ctxL.shadowColor='rgba(0,0,0,.38)'; ctxL.shadowBlur=8;
  ctxL.shadowOffsetX=1; ctxL.shadowOffsetY=1;
  ctxL.strokeStyle='rgba(32,22,6,.70)'; ctxL.lineWidth=LOUPE.rimW+2;
  ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.stroke();
  ctxL.shadowBlur=0; ctxL.shadowOffsetX=0; ctxL.shadowOffsetY=0;
  const rimA=.22+Math.sin(phase*1.85)*.07;
  ctxL.strokeStyle=`rgba(188,152,48,${rimA+.14})`; ctxL.lineWidth=LOUPE.rimW;
  ctxL.beginPath(); ctxL.arc(lx,ly,lr,0,Math.PI*2); ctxL.stroke();
  ctxL.strokeStyle=`rgba(252,228,142,${rimA*.72})`; ctxL.lineWidth=1.0;
  ctxL.beginPath(); ctxL.arc(lx,ly,lr-1,0,Math.PI*2); ctxL.stroke();
  const rimG=.48+Math.sin(phase*2.4+.4)*.32;
  if(rimG>.46){
    ctxL.strokeStyle=`rgba(255,238,158,${(rimG-.46)*2.0})`;
    ctxL.lineWidth=1.6; ctxL.lineCap='round';
    const ga=phase*.16;
    ctxL.beginPath(); ctxL.arc(lx,ly,lr,ga,ga+Math.PI*.28); ctxL.stroke();
  }
  ctxL.restore();

  /* ── 5. Réticule victorien — dessiné dans le canvas, centré sur le curseur ── */
  const rx2=lx, ry2=ly;
  const rimGlow=.48+Math.sin(phase*2.4+.4)*.32;
  ctxL.save();
  /* Cercle externe — bague laiton principale */
  ctxL.shadowColor='rgba(0,0,0,.42)'; ctxL.shadowBlur=10;
  ctxL.shadowOffsetX=1.5; ctxL.shadowOffsetY=1.5;
  ctxL.strokeStyle='rgba(28,20,5,.75)'; ctxL.lineWidth=LOUPE.rimW+2.5;
  ctxL.beginPath(); ctxL.arc(rx2,ry2,lr,0,Math.PI*2); ctxL.stroke();
  ctxL.shadowBlur=0; ctxL.shadowOffsetX=0; ctxL.shadowOffsetY=0;
  const rimA2=.24+Math.sin(phase*1.85)*.08;
  ctxL.strokeStyle=`rgba(185,150,46,${rimA2+.16})`; ctxL.lineWidth=LOUPE.rimW;
  ctxL.beginPath(); ctxL.arc(rx2,ry2,lr,0,Math.PI*2); ctxL.stroke();
  /* Anneau intérieur gravé */
  ctxL.strokeStyle=`rgba(145,112,28,${rimA2*.55})`; ctxL.lineWidth=.8;
  ctxL.beginPath(); ctxL.arc(rx2,ry2,lr-LOUPE.rimW-1,0,Math.PI*2); ctxL.stroke();
  /* Arc reflet laiton glissant */
  if(rimGlow>.46){
    ctxL.strokeStyle=`rgba(255,238,158,${(rimGlow-.46)*2.2})`;
    ctxL.lineWidth=1.8; ctxL.lineCap='round';
    const ga=phase*.16;
    ctxL.beginPath(); ctxL.arc(rx2,ry2,lr,ga,ga+Math.PI*.30); ctxL.stroke();
  }
  /* Ornements victoriens : petits rivets aux 4 points cardinaux */
  [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(a2=>{
    const rX=rx2+Math.cos(a2)*(lr+LOUPE.rimW*.5);
    const rY=ry2+Math.sin(a2)*(lr+LOUPE.rimW*.5);
    const gRivet=ctxL.createRadialGradient(rX-.5,rY-.5,0,rX,rY,3.5);
    gRivet.addColorStop(0,`rgba(248,218,110,${rimA2*.9})`);
    gRivet.addColorStop(.5,`rgba(188,148,45,${rimA2*.7})`);
    gRivet.addColorStop(1,`rgba(120,90,18,0)`);
    ctxL.beginPath(); ctxL.arc(rX,rY,3.5,0,Math.PI*2); ctxL.fillStyle=gRivet; ctxL.fill();
  });
  ctxL.restore();

  /* ── Poignée victorienne ── */
  ctxL.save();
  const hA2=Math.PI*.78;
  const hx1=rx2+Math.cos(hA2)*lr, hy1=ry2+Math.sin(hA2)*lr;
  const hx2=rx2+Math.cos(hA2)*(lr+48), hy2=ry2+Math.sin(hA2)*(lr+48);
  /* Corps de la poignée — métal gravé */
  const hGr2=ctxL.createLinearGradient(hx1,hy1,hx2,hy2);
  hGr2.addColorStop(0,'rgba(38,28,8,.95)');
  hGr2.addColorStop(.15,'rgba(168,132,42,.90)');
  hGr2.addColorStop(.5,'rgba(205,162,52,.82)');
  hGr2.addColorStop(.85,'rgba(148,112,30,.72)');
  hGr2.addColorStop(1,'rgba(80,58,14,.50)');
  ctxL.shadowColor='rgba(0,0,0,.55)'; ctxL.shadowBlur=6;
  ctxL.strokeStyle=hGr2; ctxL.lineWidth=10; ctxL.lineCap='round';
  ctxL.beginPath(); ctxL.moveTo(hx1,hy1); ctxL.lineTo(hx2,hy2); ctxL.stroke();
  /* Rainure centrale */
  ctxL.shadowBlur=0;
  ctxL.strokeStyle='rgba(22,15,4,.45)'; ctxL.lineWidth=1.2;
  ctxL.beginPath(); ctxL.moveTo(hx1,hy1); ctxL.lineTo(hx2,hy2); ctxL.stroke();
  /* Reflet axial */
  ctxL.strokeStyle=`rgba(252,222,118,${.38+Math.sin(phase*1.6)*.12})`;
  ctxL.lineWidth=2; ctxL.lineCap='round';
  ctxL.beginPath(); ctxL.moveTo(hx1+1.2,hy1-.6); ctxL.lineTo(hx2+1,hy2-.5); ctxL.stroke();
  /* Bague de jonction loupe-poignée */
  ctxL.strokeStyle=`rgba(38,28,8,.80)`; ctxL.lineWidth=3.5;
  ctxL.beginPath(); ctxL.arc(rx2,ry2,lr+.5,hA2-.28,hA2+.28); ctxL.stroke();
  ctxL.strokeStyle=`rgba(198,158,48,.72)`; ctxL.lineWidth=2.5;
  ctxL.beginPath(); ctxL.arc(rx2,ry2,lr+.5,hA2-.22,hA2+.22); ctxL.stroke();
  ctxL.restore();
}

/* ══════════════════════════════════════════════════════════
   FLAMME À PÉTROLE — organique, vivante
══════════════════════════════════════════════════════════ */
/* Phases indépendantes pour irrégularité naturelle */
let fp1=Math.random()*Math.PI*2, fp2=Math.random()*Math.PI*2,
    fp3=Math.random()*Math.PI*2, fp4=Math.random()*Math.PI*2;
let lf=1.0; // flickerVal normalisé — accessible dans la boucle de particules

function drawFlameGlow(){
  fp1+=.041+Math.random()*.018; fp2+=.027+Math.random()*.012;
  fp3+=.073+Math.random()*.022; fp4+=.015+Math.random()*.008;
  flickerVal=.72+Math.sin(fp1*2.8)*.14+Math.sin(fp2*1.4)*.09
            +Math.sin(fp3*5.2)*.05+Math.sin(fp4*.9)*.04;

  lf=Math.max(.45,Math.min(1.18,flickerVal))*(hovered?1.18:1.0)*TIME_MOD.flameIntens;
  const fx=CFG.flame.x, fy=CFG.flame.y-12;
  /* Centre du cadre — direction vers laquelle la lumière s'oriente */
  const frameCx=CFG.ring.cx, frameCy=CFG.ring.cy;

  /* Halo principal : gradient décentré vers l'intérieur du cadre
     → source à la lampe, cible décalée vers le centre */
  const lightTX=fx+(frameCx-fx)*.45; // point cible = 45% vers le centre
  const lightTY=fy+(frameCy-fy)*.35;
  const gAmb=ctxFX.createRadialGradient(fx,fy,0,lightTX,lightTY,260);
  gAmb.addColorStop(0,  `rgba(255,248,220,${lf*.70})`); // blanc-ivoire au foyer
  gAmb.addColorStop(.15,`rgba(255,230,165,${lf*.52})`);
  gAmb.addColorStop(.38,`rgba(255,195,85, ${lf*.30})`);
  gAmb.addColorStop(.60,`rgba(235,130,22, ${lf*.14})`);
  gAmb.addColorStop(.80,`rgba(195,72,4,   ${lf*.05})`);
  gAmb.addColorStop(1,  `rgba(145,35,0,   0)`);
  ctxFX.beginPath(); ctxFX.arc(lightTX,lightTY,260,0,Math.PI*2);
  ctxFX.fillStyle=gAmb; ctxFX.fill();

  /* Cœur très blanc — quasi-blanc pur */
  const gCore=ctxFX.createRadialGradient(fx,fy-12,0,fx,fy,20);
  gCore.addColorStop(0,  `rgba(255,255,255,${lf*.98})`); // blanc pur
  gCore.addColorStop(.18,`rgba(255,255,240,${lf*.92})`);
  gCore.addColorStop(.45,`rgba(255,248,195,${lf*.70})`);
  gCore.addColorStop(.75,`rgba(255,225,105,${lf*.40})`);
  gCore.addColorStop(1,  `rgba(245,165,28, 0)`);
  ctxFX.beginPath(); ctxFX.arc(fx,fy,20,0,Math.PI*2);
  ctxFX.fillStyle=gCore; ctxFX.fill();
}

function spawnFlame(){
  if(particles.length>=MAX_PARTICLES) return;
  /* Base remontée de 30px — plus de hauteur totale */
  const fy=CFG.flame.y-30;
  const fx=CFG.flame.x;
  /* Hauteur étendue × 1.6 au-delà du pin flameTop */
  const flameH=(CFG.flame.y-30-CFG.flameTop)*1.6;
  /* 3-4 particules par spawn pour plus de volume */
  const count=Math.random()<.6?4:3;
  for(let k=0;k<count;k++){
    const lateralBias=Math.sin(fp1*1.3+fp2*.7)*.10;
    const vy0=2.8+Math.random()*3.2;
    const maxFrames=Math.round((flameH/vy0)*1.12);
    particles.push({
      b:'flame',
      x: fx+(Math.random()-.5)*14+lateralBias*4,
      y: fy-Math.random()*6,
      vx:(Math.random()-.5)*.14+lateralBias*.08,
      vy:-vy0,
      life:0,
      max:Math.max(24, Math.min(100, maxFrames)),
      /* Plus large à la base = plus de volume */
      wStart:16+Math.random()*14,
      wEnd:  .2+Math.random()*.5,
      hStart:22+Math.random()*18,
      hEnd:  1.0+Math.random()*1.5,
      hot:Math.random()>.22,
      twist:(Math.random()-.5)*.006,
      rot:(Math.random()-.5)*.10,
    });
  }
}

function spawnEmber(){
  if(particles.length>=MAX_PARTICLES) return;
  const fx=CFG.flame.x, fy=CFG.flame.y-30;
  /* Particules montent très haut — hauteur ×3.5, s'évanouissent au sommet */
  const conduitTop=150;
  const particleH=(fy-conduitTop)*3.5;
  const count=Math.random()<.5?2:1;
  for(let k=0;k<count;k++){
    const vy0=1.8+Math.random()*2.8;
    const maxFrames=Math.round((particleH/vy0)*1.08);
    particles.push({
      b:'ember',
      x: fx+(Math.random()-.5)*8,
      y: fy+(Math.random()-.5)*4,
      vx:(Math.random()-.5)*.18,
      vy:-vy0,
      life:0, max:Math.max(40, Math.min(200, maxFrames)),
      sz:1.5+Math.random()*2.5,
      wobble:Math.random()*Math.PI*2, wobbleSpd:.03+Math.random()*.03,
      hot:Math.random()>.20,
    });
  }
}

function spawnHeatHaze(){
  if(particles.length>=MAX_PARTICLES) return;
  const fx=CFG.flame.x, fy=CFG.flame.y-20;
  particles.push({
    b:'haze',
    x: fx+(Math.random()-.5)*12, y:fy,
    vx:(Math.random()-.5)*.18, vy:-(0.35+Math.random()*.28),

  });
}

/* ══════════════════════════════════════════════════════════
   MÉTAL — flashs soudains aléatoires, décroissance instantanée
══════════════════════════════════════════════════════════ */
const metalFlash=CFG.metalPts.map(()=>({val:0,decay:.0,gx:0,gy:0}));

function drawMetal(){
  CFG.metalPts.forEach((pt,i)=>{
    const f=metalFlash[i];
    const trigP = hovered ? TIME_MOD.metalFreq*1.5 : TIME_MOD.metalFreq;
    if(f.val<.04 && Math.random()<trigP){
      f.val=.75+Math.random()*.25;
      f.decay=.14+Math.random()*.20;
      f.gx=(Math.random()-.5)*6;
      f.gy=(Math.random()-.5)*5;
      /* Couleur fixée au déclenchement — stable pendant le flash */
      const ws=Math.random()*.6+.4;
      f.rc=Math.round(252+ws*3); f.gc=Math.round(234-ws*12); f.bc=Math.round(138-ws*20);
    }
    /* Décroissance exponentielle rapide */
    f.val*=(1-f.decay);
    if(f.val<.025){f.val=0;return;}

    const fl=f.val;
    const x=pt.x+f.gx, y=pt.y+f.gy;
    const sz=fl*34;
    /* Couleur fixée au déclenchement (f.rc/gc/bc), pas recalculée chaque frame */
    const rc=f.rc||252, gc=f.gc||230, bc=f.bc||132;

    /* Halo aplati directionnel */
    const gO=ctxFX.createRadialGradient(x,y,0,x,y,safeR(sz*2.4));
    gO.addColorStop(0,  `rgba(${rc},${gc},${bc},${fl*.78})`);
    gO.addColorStop(.45,`rgba(218,170,35,${fl*.40})`);
    gO.addColorStop(1,  `rgba(168,110,6,0)`);
    ctxFX.save(); ctxFX.scale(1,.58);
    ctxFX.beginPath(); ctxFX.arc(x,y/.58,sz*2.4,0,Math.PI*2);
    ctxFX.fillStyle=gO; ctxFX.fill(); ctxFX.restore();

    /* Éclat central — blanc pur au pic */
    const gC=ctxFX.createRadialGradient(x-.5,y-.5,0,x,y,safeR(sz*.55));
    gC.addColorStop(0,  `rgba(255,255,255,${fl*.99})`);
    gC.addColorStop(.22,`rgba(255,252,218,${fl*.92})`);
    gC.addColorStop(.58,`rgba(250,234,175,${fl*.65})`);
    gC.addColorStop(1,  `rgba(212,160,20,0)`);
    ctxFX.save();
    ctxFX.shadowColor=`rgba(255,242,115,${fl*.85})`; ctxFX.shadowBlur=20;
    ctxFX.beginPath(); ctxFX.arc(x,y,sz*.55,0,Math.PI*2);
    ctxFX.fillStyle=gC; ctxFX.fill(); ctxFX.restore();

    /* Croix spéculaire — seulement au pic fort */
    if(fl>.40){
      const rLen=sz*3.2;
      [[1,0],[0,1]].forEach(([dx,dy])=>{
        const gr=ctxFX.createLinearGradient(x-dx*rLen,y-dy*rLen,x+dx*rLen,y+dy*rLen);
        gr.addColorStop(0,`rgba(255,252,200,0)`);
        gr.addColorStop(.5,`rgba(255,252,200,${fl*.85})`);
        gr.addColorStop(1,`rgba(255,252,200,0)`);
        ctxFX.save();
        ctxFX.globalCompositeOperation='lighter';
        ctxFX.beginPath();
        ctxFX.rect(x-dx*rLen-dy,y-dy*rLen-dx,dx*rLen*2+dy*2,dy*rLen*2+dx*2);
        ctxFX.fillStyle=gr; ctxFX.fill();
        ctxFX.globalCompositeOperation='source-over';
        ctxFX.restore();
      });
    }
  });
}

/* Couleurs par catégorie — palette enquête victorienne */
const THOUGHT_COLORS={
  idle    :'rgba(220,210,188,', // ivoire chaud
  notes   :'rgba(188,212,232,', // bleu-ardoise Victoire
  letters :'rgba(218,198,168,', // parchemin

  connection:'rgba(235,205,152,',// ambre déduction

  rare    :'rgba(212,182,215,', // lavande latin

function _thoughtCategory(chain){
  for(const[k,pool]of Object.entries(THOUGHT_CHAINS)){
    if(pool.includes(chain)) return k;
  }
  return RARE_THOUGHTS.includes(chain)?'rare':'idle';
}

function _pickChain(){
  if(sherlockState===5) return THOUGHT_CHAINS.final[0];
  if(Math.random()<.03) return RARE_THOUGHTS[Math.floor(Math.random()*RARE_THOUGHTS.length)];
  if(Math.random()<.08) return THOUGHT_CHAINS.calcul[Math.floor(Math.random()*THOUGHT_CHAINS.calcul.length)];
  const ctx = sherlockState===1?'idle'
    : sherlockState===2?'notes'
    : sherlockState===3?'letters'
    : sherlockState===4?'loupe'
    : 'connection';
  const pool=THOUGHT_CHAINS[ctx];
  /* Évite de retomber sur la même chaîne que la précédente */
  let chain=pool[Math.floor(Math.random()*pool.length)];
  if(chain===_lastChain && pool.length>1){
    chain=pool[(pool.indexOf(chain)+1+Math.floor(Math.random()*(pool.length-1)))%pool.length];
  }
  _lastChain=chain;
  return chain;
}

/* ── Spawn une pensée progressive ── */
let _lastChain=null; // anti-doublon

function spawnThought(){
  /* Compte sans allouer de tableau */
  let cnt=0; for(let i=0;i<thoughts.length;i++) if(thoughts[i].b==='t') cnt++;
  if(cnt>=MAX_THOUGHTS) return;

  const chain   = _pickChain();
  const isS5    = sherlockState===5;
  const cat     = _thoughtCategory(chain);
  const ringR   = CFG.ring.r;

  /* Origine : proche de la zone d'interaction ou du centre */
  let ox, oy;
  if(hovered && sherlockState>1){
    const mx=mouseX, my=mouseY;
    const dirToCtr=Math.atan2(CFG.thoughtCY-my,CFG.thoughtCX-mx);
    const d=30+Math.random()*80;
    ox=mx+Math.cos(dirToCtr+(Math.random()-.5)*.8)*d;
    oy=my+Math.sin(dirToCtr+(Math.random()-.5)*.8)*d;
  } else {
    const bR=20+Math.random()*60;
    const bA=Math.random()*Math.PI*2;
    ox=CFG.thoughtCX+Math.cos(bA)*bR;
    oy=CFG.thoughtCY+Math.sin(bA)*bR;
  }

  /* Direction : vers l'extérieur / caméra (axe Z simulé = direction radiale) */
  const fromCtrA=Math.atan2(oy-CFG.thoughtCY, ox-CFG.thoughtCX);
  const outwardA=fromCtrA+(Math.random()-.5)*.55; // légère déviation
  /* Perpendiculaire pour courbe douce */
  const perpA=outwardA+Math.PI/2;
  const curvStr=(Math.random()-.5)*.0016;
  const spd=isS5?.025:.05+Math.random()*.05;

  thoughts.push({
    b:'t',
    chain, cat,
    color: THOUGHT_COLORS[cat]||THOUGHT_COLORS.idle,
    chainIdx:0,
    revealProg:0,
    displayText:'',
    x:ox, y:oy,
    vx:Math.cos(outwardA)*spd, vy:Math.sin(outwardA)*spd,
    accel:isS5?1.001:1.008+Math.random()*.004,  // plus lent
    perpX:Math.cos(perpA)*curvStr,
    perpY:Math.sin(perpA)*curvStr,
    life:0, max:isS5?340:260+Math.floor(Math.random()*120), // plus long
    alpha:0,
    fsStart:isS5?26:20+Math.random()*8,   // taille de départ plus grande
    fsGrow :isS5?1.4:2.2+Math.random()*1.0, // croissance modérée
    rot:(Math.random()-.5)*.04,
    rotSpd:(Math.random()-.5)*.0006,
    tp:Math.random()*Math.PI*2, ts:.035+Math.random()*.025,
    fadeStartR:ringR*.55,
    fadeEndR  :ringR*.82,
    cx:CFG.thoughtCX, cy:CFG.thoughtCY,
    isS5,
  });
}

/* ── Dessin des pensées ── */
function drawThoughts(){
  ctxTh.clearRect(0,0,NATIVE,NATIVE);

  for(let i=thoughts.length-1;i>=0;i--){
    const p=thoughts[i], t=p.life/p.max;

    /* ── Mouvement vers la caméra — accélération + courbure ── */
    p.vx*=p.accel; p.vy*=p.accel; // accélération exponentielle
    p.vx+=p.perpX; p.vy+=p.perpY;
    p.rot+=p.rotSpd;
    p.tp+=p.ts;
    /* Micro-tremblement */
    const tx=Math.sin(p.tp*1.8)*.35+Math.sin(p.tp*3.4)*.12;
    const ty=Math.cos(p.tp*2.5)*.28+Math.cos(p.tp*2.0)*.10;

    /* Taille : zoom caméra — grossit progressivement */
    const fs=p.fsStart*(1+t*p.fsGrow);

    /* ── Progression de la révélation du mot ── */
    const curSlot = p.chain[p.chainIdx];
    const slotR=Math.max(1, curSlot.r);
    const prevChars=Math.floor(p.revealProg*curSlot.w.length);
    p.revealProg += 1/slotR;
    const newChars=Math.floor(p.revealProg*curSlot.w.length);
    /* Son de clic à chaque nouveau caractère */
    if(newChars>prevChars && newChars>0) playTypeClick();
    if(p.revealProg>=1){
      p.revealProg=1;
      /* Si un mot suivant existe, attendre un peu puis passer */
      if(!p._holdTimer) p._holdTimer=0;
      p._holdTimer++;
      if(p._holdTimer>35 && p.chainIdx<p.chain.length-1){
        p.chainIdx++;
        p.revealProg=0;
        p._holdTimer=0;
      }
    }

    /* Texte affiché : mot tronqué selon revealProg */
    const fullWord = curSlot.w;
    /* Révèle caractère par caractère, en gardant "…" tant qu'incomplet */
    const totalChars = fullWord.length;
    const visibleChars = Math.floor(p.revealProg * totalChars);
    if(visibleChars >= totalChars){
      p.displayText = fullWord;
    } else {
      /* Montre les lettres révélées + "…" */
      const base = fullWord.slice(0,Math.max(0,visibleChars));
      /* Si la fin du mot original est déjà "…" on ne redouble pas */
      p.displayText = base + (fullWord.endsWith('.')?'…':'…');
    }

    /* ── Opacité ── */
    /* Fade in doux (40 frames), max 85% */
    if(p.alpha<.85) p.alpha=Math.min(.85,p.alpha+.022);

    /* Distance au centre — dist² évite un sqrt par frame */
    const ddx=p.x-p.cx, ddy=p.y-p.cy;
    const dist2=ddx*ddx+ddy*ddy;
    const dist=Math.sqrt(dist2); // sqrt une seule fois par particule vivante

    const fadeRange=p.fadeEndR-p.fadeStartR;
    /* Évaporation spatiale — guard division */
    const spatFade = dist<=p.fadeStartR ? 1
      : dist>=p.fadeEndR ? 0
      : 1-safeDen(dist-p.fadeStartR, fadeRange, 1);

    /* Évaporation temporelle (derniers 40% de vie) */
    const timeFade = t>.60 ? Math.pow(1-(t-.60)/.40, 1.2) : 1;

    const fo   = Math.min(spatFade, timeFade);
    const a    = p.alpha * fo;

    /* Flou simulé : en début (apparition) et fin (disparition) */
    const blurIn  = Math.max(0, 1-p.alpha/.85);      // 1→0 pendant le fade-in
    const blurOut = t>.65 ? (t-.65)/.35 : 0;          // 0→1 pendant le fade-out
    const blurAmt = Math.max(blurIn, blurOut);

    if(a>.012){
      ctxTh.save();
      ctxTh.translate(p.x+tx, p.y+ty);
      ctxTh.rotate(p.rot);
      ctxTh.globalAlpha=a;
      /* Italique Courier pour ambiance machine à écrire victorienne */
      ctxTh.font=`italic bold ${fs}px 'Courier New',monospace`;
      ctxTh.textAlign='center';
      ctxTh.textBaseline='middle';

      const col=p.color; // ex: 'rgba(188,212,232,'

      if(p.isS5){
        /* Ciné Délices — doré */
        ctxTh.shadowColor=`rgba(215,178,55,${a*.65})`; ctxTh.shadowBlur=20;
        ctxTh.fillStyle=`${THOUGHT_COLORS.final}${a*.92})`;
        ctxTh.fillText(p.displayText,0,0);
        ctxTh.shadowBlur=0; ctxTh.globalAlpha=a*.22;
        ctxTh.fillStyle=`${THOUGHT_COLORS.final}1)`;
        ctxTh.fillText(p.displayText,-.4,-.4);
      } else {
        /* ── Halo de la couleur catégorie ── */
        const haloR=Math.max(1, fs*2.2*(1+blurAmt*.4));
        if(isFinite(haloR)){
          const gHalo=ctxTh.createRadialGradient(0,0,0,0,0,haloR);
          gHalo.addColorStop(0,`${col}${a*.055})`);
          gHalo.addColorStop(1,`${col}0)`);
          ctxTh.beginPath(); ctxTh.arc(0,0,haloR,0,Math.PI*2);
          ctxTh.fillStyle=gHalo; ctxTh.fill();
        }

        /* ── Dissolution fumée — fs (local), pas p.fs ── */
        if(blurAmt>.04){
          const smokeT=Math.min(1,(blurAmt-.04)/.96);
          for(let s=0;s<6;s++){
            const sAngle=((s/6)*Math.PI*2)+p.tp*1.1+(s*.8);
            const sDist=smokeT*fs*(1.0+s*.45);
            const sA=a*(1-smokeT)*(.20-s*.022);
            if(sA>.003){
              ctxTh.save();
              ctxTh.globalAlpha=sA;
              ctxTh.translate(Math.cos(sAngle)*sDist, Math.sin(sAngle)*sDist);
              ctxTh.scale(1+smokeT*(.5+s*.16), 1+smokeT*(.8+s*.20));
              ctxTh.fillStyle=`${col}1)`;
              ctxTh.fillText(p.displayText,0,0);
              ctxTh.restore();
            }
          }
          ctxTh.globalAlpha=a*Math.pow(1-smokeT,.7);
        }

        /* ── Texte principal — couleur catégorie ── */
        ctxTh.shadowColor=`${col}${a*.45})`;
        ctxTh.shadowBlur=blurAmt>.05?1.5+blurAmt*2.5:3.5; // glow doux permanent
        ctxTh.shadowOffsetX=.15; ctxTh.shadowOffsetY=.15;
        ctxTh.fillStyle=`${col}${a*.88})`;
        ctxTh.fillText(p.displayText,0,0);

        /* Soulignement discret quand mot complet révélé */
        if(p.revealProg>=1 && blurAmt<.1){
          const tw=ctxTh.measureText(p.displayText).width;
          ctxTh.shadowBlur=0; ctxTh.shadowOffsetX=0; ctxTh.shadowOffsetY=0;
          ctxTh.strokeStyle=`${col}${a*.35})`;
          ctxTh.lineWidth=.8;
          ctxTh.beginPath();
          ctxTh.moveTo(-tw/2, fs*.62); ctxTh.lineTo(tw/2, fs*.62);
          ctxTh.stroke();
        }

        /* Trace fantôme décalée — effet ruban usé */
        ctxTh.shadowBlur=0; ctxTh.shadowOffsetX=0; ctxTh.shadowOffsetY=0;
        ctxTh.globalAlpha=a*.10;
        ctxTh.fillStyle=`${col}1)`;
        ctxTh.fillText(p.displayText,.38,.38);
      }
      ctxTh.restore();
    }

    p.x+=p.vx; p.y+=p.vy;
    p.life++;
    if(p.life>=p.max) thoughts.splice(i,1);
  }
}

/* ══════════════════════════════════════════════════════════
   TICK PRINCIPAL
══════════════════════════════════════════════════════════ */
function tick(){
  if(paused){ requestAnimationFrame(tick); return; } // pause onglet caché
  frameN++; phase+=.009;
  ctxFX.clearRect(0,0,NATIVE,NATIVE);

  drawTimeTint();
  drawRingHalo();
  drawFlameGlow();
  drawMetal();
  drawLoupe();

  /* Spawns flamme — plus dense */
  if(frameN%2===0) spawnFlame();
  if(frameN%3===0 && Math.random()<(hovered?.72:.45)) spawnEmber();
  if(frameN%6===0 && Math.random()<.55) spawnHeatHaze();

  /* Pensées */
  thTimer++;
  if(thTimer>=thInterval){ spawnThought(); thTimer=0; thInterval=_nextThInt(); }

  /* ── Particules flamme + braises + haze ── */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i], t=p.life/p.max;

    if(p.b==='flame'){
      p.vx*=.982; p.vy*=.975;
      p.rot+=p.twist;
      /* Quasi pas d'oscillation latérale — sans vent */
      p.vx+=Math.sin(fp1*1.2+p.rot*2)*.010;

      const w=Math.max(0.5, p.wStart+(p.wEnd-p.wStart)*t);
      const h=Math.max(0.5, p.hStart+(p.hEnd-p.hStart)*t);
      if(!isFinite(w)||!isFinite(h)) { p.life=p.max; continue; }

      const fi=Math.min(1,t/.04);
      const fo=t>.18?Math.pow(1-(t-.18)/.82,1.0):1;
      const a=fi*fo*Math.max(.38,flickerVal)*(hovered?.82:.68);

      if(a>.005){
        ctxFX.save();
        ctxFX.translate(p.x,p.y);
        ctxFX.rotate(p.rot);

        /* Couche 1 : halo — quasi blanc, trace d'or seulement en périphérie */
        const wO=safeR(w*2.2);
        const gOuter=ctxFX.createRadialGradient(0,0,0,0,0,wO);
        gOuter.addColorStop(0,  `rgba(255,255,252,${a*.62})`);
        gOuter.addColorStop(.22,`rgba(255,255,228,${a*.44})`);
        gOuter.addColorStop(.50,`rgba(255,240,165,${a*.22})`);
        gOuter.addColorStop(.78,`rgba(255,195,55, ${a*.08})`);
        gOuter.addColorStop(1,  `rgba(230,110,5,  0)`);
        ctxFX.beginPath();
        ctxFX.ellipse(0,0,safeR(w*1.8),safeR(h*1.3),0,0,Math.PI*2);
        ctxFX.fillStyle=gOuter; ctxFX.fill();

        /* Couche 2 : cœur blanc absolu */
        const coreR=safeR(Math.max(w,h)*.82);
        const gCore=ctxFX.createRadialGradient(0,safeN(-h*.12),0,0,0,coreR);
        gCore.addColorStop(0,  `rgba(255,255,255,${a*.99})`);
        gCore.addColorStop(.08,`rgba(255,255,255,${a*.98})`);
        gCore.addColorStop(.22,`rgba(255,255,245,${a*.92})`);
        gCore.addColorStop(.42,`rgba(255,255,218,${a*.78})`);
        gCore.addColorStop(.62,`rgba(255,248,170,${a*.52})`);
        gCore.addColorStop(.82,`rgba(255,215,80, ${a*.22})`);
        gCore.addColorStop(1,  `rgba(248,140,15, 0)`);
        ctxFX.beginPath();
        ctxFX.ellipse(0,safeN(-h*.04),safeR(w),safeR(h),0,0,Math.PI*2);
        ctxFX.fillStyle=gCore; ctxFX.fill();

        ctxFX.restore();
      }
    }

    else if(p.b==='haze'){
      /* Chaleur diffuse au sommet de la flamme — quasi-invisible */
      p.vx*=.994; p.vy*=.996;
      const fi=Math.min(1,t/.12), fo=t>.5?1-(t-.5)/.5:1;
      const a=fi*fo*.045*(hovered?.9:1);
      if(a>.002){
        const hSz=Math.max(0.5,p.sz);
        const gh=ctxFX.createRadialGradient(p.x,p.y,0,p.x,p.y,hSz);
        gh.addColorStop(0,`rgba(235,205,145,${a})`);
        gh.addColorStop(.5,`rgba(215,180,110,${a*.5})`);
        gh.addColorStop(1,`rgba(190,155,80,0)`);
        ctxFX.beginPath(); ctxFX.arc(p.x,p.y,hSz,0,Math.PI*2);
        ctxFX.fillStyle=gh; ctxFX.fill();
      }
    }

    else if(p.b==='ember'){
      p.wobble+=p.wobbleSpd; p.vx+=Math.sin(p.wobble)*.008; p.vx*=.97; p.vy*=.982;
      const fadeIn=Math.min(1,t*6);
      const fadeOut=Math.pow(1-t,1.8);
      const a=fadeIn*fadeOut*(hovered?.88:.65);
      if(a>.008){
        const sz=Math.max(0.5, p.sz*(1-t*.35));
        const szHalo=safeR(sz*3.5); // guard
        const gG=p.hot?Math.round(255-t*55):Math.round(245-t*65);
        const gB=p.hot?Math.round(245-t*245):Math.round(155-t*155);
        ctxFX.save();
        ctxFX.shadowColor=`rgba(255,${Math.round(gG*.75)},${Math.round(gB*.5)},${a*.70})`;
        ctxFX.shadowBlur=sz*2.8;
        ctxFX.beginPath(); ctxFX.arc(p.x,p.y,sz,0,Math.PI*2);
        ctxFX.fillStyle=`rgba(255,${gG},${gB},${a})`;
        ctxFX.fill();
        const gE=ctxFX.createRadialGradient(p.x,p.y,0,p.x,p.y,szHalo);
        gE.addColorStop(0,`rgba(255,${gG},50,${a*.28})`);
        gE.addColorStop(1,`rgba(220,100,0,0)`);
        ctxFX.beginPath(); ctxFX.arc(p.x,p.y,szHalo,0,Math.PI*2);
        ctxFX.fillStyle=gE; ctxFX.fill();
        ctxFX.restore();
      }
    }

    p.x+=p.vx||0; p.y+=p.vy||0;
    p.life++; if(p.life>=p.max) particles.splice(i,1);
  }

  drawThoughts();
  requestAnimationFrame(tick);
}

}

(persist.found||[]).forEach(id=>discoveredAssets.add(id));
/* Encre — opacité diminue à chaque passage sur un asset (reset 24h) */
const INK_KEY='sherlock_ink';
function _loadInk(){
  try{
    const raw=JSON.parse(localStorage.getItem(INK_KEY)||'{}');
    const now=Date.now();
    /* Reset si > 24h */
    if(now-(raw.ts||0)>86400000) return {};
    return raw.data||{};
  }catch(e){ return {}; }
}
function _saveInk(data){
  try{ localStorage.setItem(INK_KEY,JSON.stringify({ts:Date.now(),data})); }
  catch(e){}
}
const inkFade=_loadInk(); // {assetId: 0.0–1.0 fade}
/* Réduire l'opacité à chaque révélation */
function _wearInk(id){
  inkFade[id]=Math.min(.30,(inkFade[id]||0)+0.08);
  _saveInk(inkFade);
}

/* ══════════════════════════════════════════════════════════
   MICRO-SON — clic machine à écrire
══════════════════════════════════════════════════════════ */
let audioCtx=null;
let soundEnabled=false;
/* Initialiser l'AudioContext au premier geste utilisateur */
function _initAudio(){
  if(audioCtx) return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    soundEnabled=true;
  }catch(e){}
}
wrap.addEventListener('mouseenter',_initAudio,{once:true});
wrap.addEventListener('touchstart',_initAudio,{once:true});

function playTypeClick(){
  if(!soundEnabled||!audioCtx||audioCtx.state==='suspended') return;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.018,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  /* Bruit impulsionnel court — clic mécanique */
  for(let i=0;i<d.length;i++){
    const env=Math.pow(1-i/d.length,3.5);
    d[i]=(Math.random()*2-1)*env*(i<3?.8:.15);
  }
  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();
  gain.gain.value=0.08; // très discret
  src.buffer=buf;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}
/* Son sur découverte */
function playRevealChime(){
  if(!soundEnabled||!audioCtx) return;
  [523,659,784].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator();
    const g2=audioCtx.createGain();
    osc.frequency.value=freq;
    osc.type='sine';
    g2.gain.setValueAtTime(0,audioCtx.currentTime+i*.08);
    g2.gain.linearRampToValueAtTime(.06,audioCtx.currentTime+i*.08+.02);
    g2.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+i*.08+.5);
    osc.connect(g2); g2.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime+i*.08);
    osc.stop(audioCtx.currentTime+i*.08+.6);
  });
}

/* ══════════════════════════════════════════════════════════
   VARIANTE JOUR / NUIT — drawTimeTint appelée dans tick
══════════════════════════════════════════════════════════ */

/* Message d'ambiance au premier chargement */
const TIME_GREET=IS_NIGHT
  ? [{w:'Londres, 2h du matin.',r:130}]
  : IS_EVENING
  ? [{w:'Le crépuscule tombe.',r:120}]
  : null;

/* ══════════════════════════════════════════════════════════
   PROGRESSION — arc de niveau + animation "cas résolu"
══════════════════════════════════════════════════════════ */
const TOTAL_CLUES=CFG.revealAssets.length; // 4
let solvedShown=false;
let solvedAnim=0; // 0 = inactif, 0→1 = animation en cours

function drawProgressArc(){
  const found=discoveredAssets.size;
  if(found===0) return;
  const cx=CFG.ring.cx, cy=CFG.ring.cy, r=CFG.ring.r+14;
  const prog=Math.min(1,found/TOTAL_CLUES);
  /* Arc de fond très discret */
  ctxFX.save();
  ctxFX.strokeStyle='rgba(145,108,22,.15)'; ctxFX.lineWidth=2.5; ctxFX.lineCap='round';
  ctxFX.beginPath();
  ctxFX.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2);
  ctxFX.stroke();
  /* Arc de progression — ambre animé */
  const arcEnd=-Math.PI/2+Math.PI*2*prog;
  const gArc=ctxFX.createLinearGradient(cx-r,cy,cx+r,cy);
  gArc.addColorStop(0,'rgba(215,178,55,.55)');
  gArc.addColorStop(1,'rgba(235,198,88,.80)');
  ctxFX.strokeStyle=gArc; ctxFX.lineWidth=2.5;
  ctxFX.beginPath(); ctxFX.arc(cx,cy,r,-Math.PI/2,arcEnd); ctxFX.stroke();
  /* Point terminal lumineux */
  const ex=cx+Math.cos(arcEnd)*r, ey=cy+Math.sin(arcEnd)*r;
  const gDot=ctxFX.createRadialGradient(ex,ey,0,ex,ey,5);
  gDot.addColorStop(0,`rgba(255,235,140,.90)`);
  gDot.addColorStop(1,`rgba(215,178,55,0)`);
  ctxFX.beginPath(); ctxFX.arc(ex,ey,5,0,Math.PI*2); ctxFX.fillStyle=gDot; ctxFX.fill();
  ctxFX.restore();

  /* Animation "cas résolu" — quand tous les indices trouvés */
  if(prog>=1 && !solvedShown){
    solvedShown=true;
    solvedAnim=0.001; // démarre
    playRevealChime();
    setTimeout(()=>{
      /* Pensée finale */
      thoughts=thoughts.filter(p=>!p.b==='t');
      spawnSolvedThought();
    },600);
  }
}

function spawnSolvedThought(){
  /* Pensée spéciale "Cas résolu" centrée, grande, dorée */
  thoughts.push({
    b:'t', chain:[{w:'L\'affaire est résolue.',r:160}],
    cat:'final', color:THOUGHT_COLORS.final,
    chainIdx:0, revealProg:0, displayText:'',
    x:CFG.thoughtCX, y:CFG.thoughtCY-80,
    vx:0, vy:-.12, accel:1.001, perpX:0, perpY:0,
    life:0, max:380, alpha:0,
    fsStart:36, fsGrow:0.8,
    rot:0, rotSpd:0, tp:0, ts:.02,
    fadeStartR:CFG.ring.r*.75, fadeEndR:CFG.ring.r*.92,
    cx:CFG.thoughtCX, cy:CFG.thoughtCY, isS5:true,
  });
}

/* Anneau "solved" pulsant sur le ring */
function drawSolvedAnim(){
  if(solvedAnim<=0) return;
  solvedAnim=Math.min(1,solvedAnim+.008);
  const ease=solvedAnim<.5?solvedAnim*2:2-solvedAnim*2; // triangle
  const cx=CFG.ring.cx, cy=CFG.ring.cy, r=CFG.ring.r;
  /* Expansion d'un anneau doré */
  for(let ring=0;ring<3;ring++){
    const rOff=ring*22+ease*55;
    const a=(1-ease)*(1-ring*.3)*.45;
    if(a<.005) continue;
    ctxFX.save();
    ctxFX.strokeStyle=`rgba(235,198,88,${a})`;
    ctxFX.lineWidth=2.5-ring*.6;
    ctxFX.beginPath(); ctxFX.arc(cx,cy,r+rOff,0,Math.PI*2); ctxFX.stroke();
    ctxFX.restore();
  }
  if(solvedAnim>=1) solvedAnim=0; // single shot
}

},700);
